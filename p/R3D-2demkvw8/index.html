/* موقع لغز «الحقيقة واحدة»: صفحة وحدة، كل ملف بثيم من ثيمات BOXCUP.
   عمود واحد: شريط الملفات فوق، والملف المفتوح تحته. */
:root{
  --display:'Lifta','Anton','Cairo',Impact,sans-serif; --body:'Cairo',system-ui,sans-serif;
  --latin:'Anton',Impact,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --bg:#0a0a0c; --glow:#c4102b55; --on-bg:#ffffff; --on-bg-mute:#a9a9b3;
  --panel:#141418; --panel2:#1d1d22; --line:#2e2e36; --fg:#ffffff; --mute:#8e8e99;
  --acc:#e3122f; --acc-fg:#ffffff; --hi:#ff2e4a; --hi-bg:#e3122f26; --live:#ffffff;
  --b1:#ffffff; --b3:#ff2e4a; --shadow:#00000080;
  --logo-acc:var(--acc); --chip-bg:var(--bg); --chip-fg:var(--on-bg); --live-text:#ff6b7d;
  --box-bg:#0f0f12; --box-line:#ffffff1f; --box-fg:#ffffff; --label-acc:var(--acc);
  --cta-bg:var(--acc); --cta-fg:var(--acc-fg);
  --radius:14px;
  color-scheme:dark;
}

[data-skin="silver"]{--bg:#060607;--glow:#c9ccd633;--on-bg:#f2f3f5;--on-bg-mute:#8d9099;--panel:#101012;--panel2:#18181b;--line:#2a2a2f;--fg:#f2f3f5;--mute:#8d9099;--acc:#d9dce3;--acc-fg:#0a0a0c;--hi:#ffffff;--hi-bg:#ffffff14;--live:#ff3b4e;--logo-acc:#d9dce3;--label-acc:#d9dce3;--cta-bg:#d9dce3;--cta-fg:#0a0a0c;--live-text:#ff6b7d}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(1000px 560px at 50% -10%,var(--glow),transparent 66%) no-repeat,var(--bg);color:var(--on-bg);font-family:var(--body);font-size:16px;line-height:1.75;transition:background-color .5s}
::selection{background:var(--acc);color:var(--acc-fg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--logo-acc);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 72px}

/* الشريط العلوي */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.logo .pill{width:30px;height:14px;border-radius:7px;background:linear-gradient(90deg,#f4f4f6 50%,#e3122f 50%);box-shadow:0 0 18px -2px var(--glow);transform:rotate(-24deg)}
.logo .en{font-family:var(--latin);letter-spacing:.06em;font-size:21px;color:var(--logo-acc);direction:ltr}
.logo .ar{font-family:var(--display);font-size:21px;color:var(--on-bg)}
.count{font-family:var(--mono);font-size:13px;color:var(--on-bg-mute);direction:ltr;unicode-bidi:isolate}
svg{direction:ltr}

/* شريط الملفات */
.files{display:flex;gap:8px;overflow-x:auto;padding-block:16px 8px;margin-inline:-4px;padding-inline:4px;scrollbar-width:thin}
.file{flex:0 0 auto;min-width:88px;border:1px solid var(--box-line);background:var(--box-bg);color:var(--box-fg);border-radius:12px 12px 4px 4px;padding:8px 12px 10px;text-align:right;cursor:pointer;display:grid;gap:0;position:relative;transition:transform .15s}
.file:hover:not(:disabled){transform:translateY(-2px)}
.file .n{font-family:var(--mono);font-size:11px;opacity:.65;direction:ltr;text-align:right}
.file .name{font-family:var(--display);font-size:18px;line-height:1.35}
.file .slot{font-family:var(--body);font-weight:700;font-size:14px;color:var(--label-acc);min-height:1.4em}
.file:disabled{opacity:.38;cursor:not-allowed}
.file[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--label-acc)}
.file.solved .slot{font-weight:600}

/* رأس الملف */
.st-head{padding-block:30px 20px;display:grid;gap:6px}
.st-head.has-img{grid-template-columns:1fr auto;align-items:center;column-gap:20px}
.st-head .txt{display:grid;gap:6px;min-width:0}
.portrait{width:clamp(96px,22vw,168px);aspect-ratio:1;background:#fff;border-radius:22px;padding:8px;box-shadow:0 8px 28px #0004;border:1px solid var(--box-line)}
.portrait img{width:100%;height:100%;object-fit:contain;display:block}
.pc{background:#1d2230;border-radius:10px;overflow:hidden;border:1px solid #0006;color:#e8ebf2}

/* ---------- أدوات ---------- */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
function norm(s){
  s = (s || '').normalize('NFKC').toLowerCase();
  s = s.replace(/[ً-ٰٟـ]/g, '');
  s = s.replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/ک/g, 'ك').replace(/ی/g, 'ي');
  s = s.replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x660)).replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x6F0));
  s = s.replace(/[\s\-_.,:;'"«»!?؟،()\[\]{}\/\\]+/g, '');
  return s;
}
async function sha(s){ const h = await crypto.subtle.digest('SHA-256', te.encode(s)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
async function derive(pass, salt){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function open(key, box){
  try { const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(box.iv)}, key, b64(box.ct)); return JSON.parse(td.decode(pt)); }
  catch(e){ return null; }
}

/* ---------- الحالة ---------- */
const KEY = 'aptx4869.v1';
const blank = () => ({answers:{}, rewards:{}, unlockedAt:{}, fails:{}, startedAt:null, finishedAt:null, name:''});
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const C = {};               // محتوى الملفات المفتوحة
const NODES = P.nodes;
const ORDER = P.order;
const VIEWS = P.views;      // [{id, nodes:[...], name, n}]
const chain = id => NODES[id].anc.map(a => S.answers[a]).join('|');
const unlocked = id => NODES[id].parents.every(p => S.answers[p] != null);
const solved = id => S.answers[id] != null;

async function unlockContent(id){
  if (C[id]) return C[id];
  if (id === 'gate') { C.gate = P.gate; }
  else {
    const key = await derive('c|' + id + '|' + chain(id), NODES[id].salt);
    const c = await open(key, NODES[id].box);
    if (!c) return null;
    C[id] = c;
  }
  if (!S.unlockedAt[id]) { S.unlockedAt[id] = Date.now(); save(); }
  return C[id];
}

async function check(id, raw){
  const n = norm(raw);
  if (!n) return {ok:false};
  const key = await derive('a|' + id + '|' + chain(id) + '|' + n, NODES[id].salt);
  for (const box of NODES[id].check) {
    const r = await open(key, box);
    if (r) return {ok:true, r};
  }
  const h = await sha(NODES[id].dsalt + '|' + n);
  const d = NODES[id].decoys.find(x => x.h === h);
  return {ok:false, msg: d ? d.msg : null};
}

const WRONG = ['لا. مو هذا.', 'غلط. ارجع للأدلة.', 'مو صحيح.', 'لا… فكّر مرة ثانية.', 'الحقيقة واحدة، وهذي مو هي.'];
async function submit(id, raw, fbEl){
  const now = Date.now();
  const f = (S.fails[id] || []).filter(t => now - t < 60000);
  if (f.length >= 6) {
    const wait = Math.ceil((f[0] + 60000 - now) / 1000);
    if (fbEl) { fbEl.className = 'fb bad'; fbEl.textContent = 'محاولات كثيرة. استنى ' + toAr(wait) + ' ثانية.'; }
    return false;
  }
  const res = await check(id, raw);
  if (!res.ok) {
    f.push(now); S.fails[id] = f; save();
    if (fbEl) {
      fbEl.className = res.msg ? 'fb near' : 'fb bad';
      fbEl.textContent = res.msg || WRONG[Math.floor(Math.random() * WRONG.length)];
    }
    return false;
  }
  S.answers[id] = res.r.canon;
  S.rewards[id] = res.r.reward || null;
  if (id === 'gate' && !S.startedAt) S.startedAt = now;
  if (id === 'phone') S.finishedAt = now;
  save();
  for (const k of ORDER) if (!C[k] && unlocked(k)) await unlockContent(k);
  justSolved = id;
  render();
  if (id === 'gate') setTimeout(() => { if (!location.hash || location.hash === '#gate') location.hash = 'conan'; }, 1600);
  return true;
}
let justSolved = null;

/* ---------- العرض ---------- */
const viewOf = id => VIEWS.find(v => v.nodes.includes(id));
const viewUnlocked = v => unlocked(v.nodes[0]);
const viewSolved = v => v.nodes.every(solved);
function letterOf(v){ for (const id of v.nodes) { const r = S.rewards[id]; if (r && r.letter) return r; } return null; }
function currentView(){
  const h = (location.hash || '').slice(1);
  const v = VIEWS.find(x => x.id === h);
  if (v && viewUnlocked(v) && C[v.nodes[0]]) return v;
  const open = VIEWS.filter(x => viewUnlocked(x) && !viewSolved(x) && C[x.nodes[0]]);
  if (open.length) return open[open.length - 1];
  const fin = VIEWS[VIEWS.length - 1];
  return C[fin.nodes[0]] ? fin : VIEWS[0];
}

function renderFiles(cur){
  const box = $('#files'); box.innerHTML = '';
  let got = 0;
  for (const v of VIEWS) {
    if (v.id === 'gate') continue;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'file';
    const ok = viewUnlocked(v) && C[v.nodes[0]];
    const L = letterOf(v);
    if (L) got++;
    if (viewSolved(v)) b.classList.add('solved');
    b.disabled = !ok;
    if (cur && cur.id === v.id) b.setAttribute('aria-current', 'page');
    b.innerHTML = `<span class="n">${v.n}</span><span class="name">${ok ? v.name : '؟؟؟'}</span><span class="slot">${L ? `<b class="sl">${L.letter}</b> · ${L.pos}` : ''}</span>`;
    b.addEventListener('click', () => { location.hash = v.id; });
    box.appendChild(b);
  }
  $('#count').textContent = got + ' / 8';
}

function hintsHTML(id, c){
  if (!c.hints || !c.hints.length || solved(id)) return '';
  const t0 = S.unlockedAt[id] || Date.now();
  const mins = (Date.now() - t0) / 60000;
  return `<div class="hints" data-hints="${id}">` + c.hints.map((h, i) => {
    const left = Math.ceil(h.after - mins);
    return left > 0
      ? `<button class="hint" type="button" disabled>تلميح ${toAr(i + 1)} · بعد ${toAr(left)} د</button>`
      : `<button class="hint" type="button" data-i="${i}">تلميح ${toAr(i + 1)}</button>`;
  }).join('') + `</div>`;
}

function rewardHTML(id){
  const r = S.rewards[id];
  if (!r) return '';
  const pop = justSolved === id ? ' pop' : '';
  if (r.letter) return `<div class="panel"><div class="reward${pop}"><div class="L">${r.letter}</div><div class="txt"><span class="pos">الخانة ${r.pos}</span><p>${r.text}</p></div></div></div>`;
  if (r.text) return `<div class="panel"><p>${r.text}</p></div>`;
  return '';
}

function answerHTML(id, c){
  if (c.form !== 'text') return '';
  if (solved(id)) return '';
  return `<div class="panel"><span class="label">${c.ask || 'الجواب'}</span>
    <form class="answer" data-form="${id}" autocomplete="off">
      <input id="in-${id}" name="a" dir="auto" placeholder="${c.placeholder || '…'}" aria-label="${c.ask || 'الجواب'}" spellcheck="false" autocapitalize="off">
      <button class="cta" type="submit">افتح</button>
    </form><div class="fb" id="fb-${id}" role="status" aria-live="polite"></div></div>`;
}

function render(){
  document.querySelectorAll(".fx").forEach(e => e.remove());
  const v = currentView();
  const head = C[v.nodes[0]];
  document.documentElement.dataset.skin = head.meta.skin || '';
  renderFiles(v);
  const m = $('#main');
  let html = '';
  if (v.id !== 'gate') {
    const meta = head.meta;
    html += `<div class="st-head${meta.img ? ' has-img' : ''}"><div class="txt"><span class="eyebrow">${meta.eyebrow}</span><h1>${meta.title}</h1><span class="epithet">${meta.epithet}</span>
      <div class="symbols">${(meta.symbols || []).map(s => `<span class="sym">${s}</span>`).join('')}</div></div>${meta.img ? `<div class="portrait"><img src="${meta.img}" alt="${meta.title}"></div>` : ''}</div>`;
  }
  for (const id of v.nodes) {
    const c = C[id];
    if (!c) continue;
    html += `<section class="node" data-node="${id}">`;
    html += c.html;
    html += answerHTML(id, c);
    html += rewardHTML(id);
    if (solved(id) && S.rewards[id] && S.rewards[id].html) html += S.rewards[id].html;
    html += hintsHTML(id, c);
    html += `</section>`;
  }
  const nv = nextView(v);
  if (viewSolved(v) && nv) html += `<div class="next"><a class="cta" href="#${nv.id}" style="text-decoration:none;display:inline-block">الملف التالي: ${nv.name}</a></div>`;
  m.innerHTML = html;

let AC = null;
function ac(){ if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }

function tone(freqs, t, dur, vol = .18, type = 'sine'){
  const a = ac(), g = a.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.setValueAtTime(vol, t + Math.max(.02, dur - .02)); g.gain.linearRampToValueAtTime(0, t + dur);

  for (const f of freqs) { const o = a.createOscillator(); o.type = type; o.frequency.value = f; o.connect(g); o.start(t); o.stop(t + dur + .02); }
}
function pianoNote(f, t, dur, vol){
  const a = ac(), g = a.createGain(), o = a.createOscillator(), o2 = a.createOscillator();
  o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = f; o2.frequency.value = f * 2;
  const g2 = a.createGain(); g2.gain.value = .25;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(a.destination);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(vol * .25, t + dur * .6); g.gain.exponentialRampToValueAtTime(.0001, t + dur + .5);
  o.start(t); o2.start(t); o.stop(t + dur + .6); o2.stop(t + dur + .6);
}

B.gate = (sec) => {
  const cap = $('.capsule', sec); if (!cap) return;
  const ring = $('.ring', cap);
  const len = ring ? ring.getTotalLength() : 0;
  if (ring) { ring.style.strokeDasharray = len; ring.style.strokeDashoffset = len; }
  const armed = !!C.vermouth;
  cap.classList.toggle('armed', armed);
  let t0 = 0, raf = 0;
  const HOLD = 4869;
  const stop = () => { cancelAnimationFrame(raf); t0 = 0; if (ring) { ring.style.transition = 'stroke-dashoffset .3s'; ring.style.strokeDashoffset = len; } };
  const step = () => {
    const p = Math.min(1, (performance.now() - t0) / HOLD);
    if (ring) ring.style.strokeDashoffset = len * (1 - p);
    if (p >= 1) { t0 = 0; reveal(); return; }
    raf = requestAnimationFrame(step);
  };
  const reveal = () => {
    cap.classList.add('open');
    setTimeout(() => {
      overlay(`<div class="panel">${C.vermouth.data.capsule}<div style="margin-top:14px"><a class="cta" href="#vermouth" data-close style="text-decoration:none;display:inline-block">رجوع لملف فيرموث</a></div></div>`, () => { cap.classList.remove('open'); stop(); });

B.heist = (sec, data) => {
  const moon = $('.moon', sec), playB = $('[data-play]', sec), slowB = $('[data-slow]', sec), quietB = $('[data-quiet]', sec);
  if (!moon || !playB) return;
  const DIM = '#5e6a8f', LIT = '#fffbe8';
  moon.setAttribute('fill', DIM);
  let timers = [];
  let playing = false;
  const stopAll = () => { timers.forEach(clearTimeout); timers = []; moon.setAttribute('fill', DIM); stopSound(); playing = false; playB.textContent = 'اسمع'; };
  const run = (unit, sound) => {
    stopAll();
    const a = sound ? ac() : null;
    const t0 = sound ? a.currentTime + .4 : 0;
    const start = performance.now() + 400;
    let tt = 0;
    const seq = data.seq; // [on, off, on, off ...] بوحدات
    const total = (seq.reduce((x, y) => x + y, 0) + 10) * 2;
    if (sound) {
      // سوناتا ضوء القمر: ثلاثيات بطيئة تحت الرسالة
      const tri = data.tri; let k = 0; const step = .34;
      for (let bar = 0; k * step < total * unit + 2; bar++) {
        const ch = tri[bar % tri.length];
        pianoNote(ch.bass, t0 + k * step, step * 12, .09);
        for (let r = 0; r < 4; r++) for (const n of ch.notes) { pianoNote(n, t0 + k * step, step * 1.4, .06); k++; }
      }
    }
    playing = sound; if (sound) playB.textContent = 'إيقاف';
    for (let loop = 0; loop < 2; loop++) {
      for (let i = 0; i < seq.length; i++) {
        const d = seq[i] * unit;
        if (i % 2 === 0) {
          const at = tt;
          timers.push(setTimeout(() => moon.setAttribute('fill', LIT), start - performance.now() + at * 1000));
          timers.push(setTimeout(() => moon.setAttribute('fill', DIM), start - performance.now() + (at + d) * 1000));
          if (sound) tone([1318.5], t0 + at, d, .07);
        }
        tt += d;
      }
      tt += 10 * unit;
    }
    timers.push(setTimeout(stopAll, start - performance.now() + tt * 1000 + 300));
  };
  playB.addEventListener('click', () => playing ? stopAll() : run(.2, true));
  slowB && slowB.addEventListener('click', () => run(.34, true));
  quietB && quietB.addEventListener('click', () => run(.26, false));
};

B.akai = (sec, data) => {

    lens.setAttribute('viewBox', `${x - span / 2} ${y - span / 2} ${span} ${span}`);
    const pr = pano.getBoundingClientRect();

  pano.addEventListener('pointermove', e => aim(e.clientX, e.clientY, e.pointerType === 'touch'));

function shatter(){
  const fx = document.createElement('div'); fx.className = 'fx'; fx.setAttribute('aria-hidden', 'true');
  let seed = 4869; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const W = innerWidth, H = innerHeight, S = Math.min(W, H);
  let paths = '';
  for (const [cx, cy] of [[0, 0], [W, H * .62], [W * .18, H]]) {
    const n = 6 + Math.floor(R() * 3);
    for (let i = 0; i < n; i++) {
      const a = Math.atan2(H / 2 - cy, W / 2 - cx) + (i / (n - 1) - .5) * 2.2 + (R() - .5) * .2;
      let x = cx, y = cy, d = `M${x.toFixed(0)} ${y.toFixed(0)}`, len = 0;
      const reach = S * (.12 + R() * .16), steps = 4 + Math.floor(R() * 3);
      for (let k = 1; k <= steps; k++) { const r = reach * k / steps, aa = a + (R() - .5) * .35; const nx = cx + Math.cos(aa) * r, ny = cy + Math.sin(aa) * r; len += Math.hypot(nx - x, ny - y); x = nx; y = ny; d += ` L${x.toFixed(0)} ${y.toFixed(0)}`; }
      paths += `<path d="${d}" style="--l:${len.toFixed(0)};animation-delay:${(R() * .4).toFixed(2)}s"/>`;
    }
  }
  fx.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${paths}</svg>`;
  document.body.appendChild(fx);
}
B.amuro = (sec) => {
  const area = $('[data-lensarea]', sec), lens = $('[data-lens]', sec), secret = $('[data-secret]', sec);
  if (!area || !lens || !secret) return;
  const update = () => {
    const l = lens.getBoundingClientRect(), t = secret.getBoundingClientRect();
    secret.style.clipPath = `circle(${(l.width / 2 - 3).toFixed(0)}px at ${(l.left + l.width / 2 - t.left).toFixed(0)}px ${(l.top + l.height / 2 - t.top).toFixed(0)}px)`;
  };
  let drag = null;
  lens.addEventListener('pointerdown', e => {
    e.preventDefault(); lens.setPointerCapture && lens.setPointerCapture(e.pointerId);
    const l = lens.getBoundingClientRect(); drag = { dx: e.clientX - l.left, dy: e.clientY - l.top };
  });
  lens.addEventListener('pointermove', e => {
    if (!drag) return;
    const a = area.getBoundingClientRect(), w = lens.offsetWidth;
    const x = Math.max(-w / 2, Math.min(a.width - w / 2, e.clientX - a.left - drag.dx));
    const y = Math.max(-w / 2, Math.min(a.height - w / 2, e.clientY - a.top - drag.dy));
    lens.style.left = x + 'px'; lens.style.top = y + 'px'; lens.style.right = 'auto'; lens.style.bottom = 'auto';
    update();
  });
  for (const ev of ['pointerup', 'pointercancel']) lens.addEventListener(ev, () => { drag = null; });
  addEventListener('resize', update);
  update();
};
