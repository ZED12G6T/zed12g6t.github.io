:root{
  --display:'Lifta','Anton',Impact,sans-serif; --body:'Lifta','Anton',system-ui,sans-serif; --mono:'Bebas Neue','Anton','Lifta',Impact,sans-serif;
  --bg:#09090b; --bg2:#101014; --panel:#141418; --panel2:#1c1c21; --line:#2a2a31; --line2:#3a3a43;
  --fg:#f5f5f7; --mute:#9a9aa6; --dim:#6b6b76;
  --acc:#e3122f; --acc2:#ff2e4a; --acc-bg:#e3122f1f; --ok:#36d39a; --warn:#ffb020;
  --radius:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(900px 520px at 50% -12%,#c4102b40,transparent 65%) no-repeat,var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;font-synthesis:none}
h1,h2,h3,b,strong,.btn,.chip{font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px;border-radius:12px}
@keyframes blink{50%{opacity:.35}}
.logo{font-family:var(--display);letter-spacing:.04em;line-height:1;display:inline-flex;align-items:center;gap:.2em;direction:ltr}
.logo i{width:.42em;height:.42em;border-radius:50%;background:var(--acc);box-shadow:0 0 18px var(--acc);display:inline-block}

/* ---------- الدخول ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lcard{width:100%;max-width:420px;text-align:center}
.lcard .logo{font-size:72px}
.lcard h1{margin:18px 0 6px;font-size:32px;font-weight:800}
.lcard p.sub{margin:0 0 26px;color:var(--mute);font-size:20px}
.field{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font-family:var(--mono);font-size:28px;letter-spacing:.14em;padding:10px 12px;text-transform:uppercase;direction:ltr;text-align:center}
.field input::placeholder{color:var(--dim);letter-spacing:.08em}
.btn{border:0;border-radius:12px;padding:10px 20px;font-weight:700;background:var(--acc);color:#fff;white-space:nowrap;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--fg)}
.btn.sm{padding:7px 14px;font-size:16px;border-radius:10px}
.msg{min-height:28px;margin-top:14px;font-size:19px;color:var(--mute)}
.msg.err{color:var(--acc2)}
.msg.ok{color:var(--ok)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{margin-top:40px;color:var(--dim);font-size:18px}

/* ---------- المكتبة ---------- */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:#09090bcc;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .logo{font-size:30px}
.bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:15px;font-weight:600;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:400;direction:ltr;font-size:1.25em;letter-spacing:.05em}
.chip .sd{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;flex:none}
.chip.temp .sd{animation:blink 1.4s infinite}
.chip.perm{color:var(--ok);border-color:#36d39a55}
.chip.temp{color:var(--warn);border-color:#ffb02055}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 64px}
.hero h2{margin:0;font-size:30px;font-weight:800}
.hero p{margin:4px 0 0;color:var(--mute);font-size:19px}
.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:5px 16px;border-radius:9px;color:var(--mute);font-size:16px}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:0 1px 0 #ffffff14 inset}
.seg button .n{font-family:var(--mono);font-size:1.1em;margin-inline-start:4px;opacity:.6}
.alert{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 14px;border-radius:14px;background:#ffb02012;border:1px solid #ffb02044;color:#ffd58a;font-size:16px}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--dim);border:1px dashed var(--line);border-radius:var(--radius)}
.empty strong{display:block;color:var(--fg);font-size:20px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:18px}
.game{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .25s}
.game::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),#ffffff12,transparent 60%)}
.game:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 18px 40px #0008}
.game:hover::after{opacity:1}
.game.group{--ga:#b07cff;--ga-fg:#140a24}
.game.group .cover{background:radial-gradient(120% 90% at 80% 10%,color-mix(in srgb,var(--ga) 35%,transparent),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--ga) 14%,#0b0b0e),#0b0b0e 70%)}
.game.group .cover .ct small{color:color-mix(in srgb,var(--ga) 55%,#fff)}
.game.group .btn{background:var(--ga);color:var(--ga-fg)}
.game.group .cover img{filter:drop-shadow(0 6px 18px #000a);mix-blend-mode:normal;opacity:1;height:auto;width:50%;max-width:50%;bottom:18%;left:5%}
.cover .badge{position:absolute;top:12px;left:12px;font-size:14px;padding:1px 10px;border-radius:999px;background:var(--acc);color:#fff}
.game.group .cover .badge{background:var(--ga);color:var(--ga-fg)}
.meta{font-size:15px;color:var(--mute);display:flex;align-items:center;gap:6px}
.meta .sd{width:8px;height:8px;border-radius:50%;background:var(--ga,#b07cff)}
.cover.photo img{filter:none!important;mix-blend-mode:normal!important;opacity:1;height:72%;width:auto;max-width:38%;bottom:12%;left:7%;border:3px solid #fff;border-radius:6px;transform:rotate(-5deg);box-shadow:0 10px 24px #000b}
.cover{position:relative;aspect-ratio:16/10;background:radial-gradient(120% 90% at 80% 10%,#e3122f55,transparent 60%),linear-gradient(160deg,#1a0508,#0b0b0e 70%);overflow:hidden}
.cover img{position:absolute;bottom:0;left:4%;height:88%;max-width:52%;object-fit:contain;object-position:left bottom;filter:invert(1);mix-blend-mode:screen;opacity:.92}
.cover .ct{position:absolute;top:14px;right:16px;font-family:var(--display);font-size:34px;line-height:1;direction:ltr;text-shadow:0 2px 14px #000}
.cover .ct small{display:block;font-family:var(--body);font-size:15px;font-weight:700;color:#ffb3bd;margin-top:6px;direction:rtl;text-align:right}
.cover .tag{position:absolute;bottom:12px;right:14px;font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:#000a;border:1px solid #fff2}
.gbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.gbody h3{margin:0;font-size:18px;font-weight:800}
.gbody p{margin:0;color:var(--mute);font-size:16px;flex:1}
.prog{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mute)}
.prog .tr{flex:1;height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--acc);border-radius:9px}
.prog b{font-family:var(--mono);direction:ltr;color:var(--fg);font-size:1.3em;letter-spacing:.05em}
.game.done .prog .tr i{background:var(--ok)}
.game .btn{width:100%}
.soon{border-style:dashed;background:transparent;align-items:center;justify-content:center;text-align:center;padding:30px 16px;color:var(--dim);min-height:220px}
.soon:hover{transform:none;box-shadow:none}
.soon .plus{font-size:40px;line-height:1;margin-bottom:8px}

/* ---------- اللعب ---------- */
#play{position:fixed;inset:0;z-index:20;background:var(--bg)}
#play iframe{width:100%;height:100%;border:0;display:block}
.loading{position:absolute;inset:0;background:var(--bg);padding:20px 16px;display:flex;flex-direction:column;gap:14px;align-items:center;transition:opacity .3s}
.loading.gone{opacity:0;pointer-events:none}
.loading .sk{width:100%;max-width:560px;border-radius:14px;background:linear-gradient(90deg,var(--panel) 0,var(--panel2) 40%,var(--panel) 80%);background-size:200% 100%;animation:shm 1.3s linear infinite}
@keyframes shm{to{background-position:-200% 0}}
#back{position:fixed;left:12px;bottom:12px;z-index:21;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:#000c;border:1px solid #fff3;font-size:15px;font-weight:700;backdrop-filter:blur(6px);opacity:.7;transition:opacity .2s}
#back:hover{opacity:1}

/* ---------- لوحة الأكواد ---------- */
.modal{position:fixed;inset:0;z-index:30;background:#000b;display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:20px}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet .note{margin:0 0 14px;color:var(--mute);font-size:16px}
.codes{display:grid;gap:8px}
.code{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.code .n{font-family:var(--mono);color:var(--dim);font-size:14px;width:26px;text-align:center}
.code .v{flex:1;font-family:var(--mono);font-size:24px;letter-spacing:.1em;direction:ltr;text-align:left}
.code.given{opacity:.45}
.code.given .v{text-decoration:line-through}
.code .st{font-size:14px;color:var(--mute);white-space:nowrap}
.sheet .row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);font-weight:400;padding:8px 18px;border-radius:999px;font-size:16px;animation:tin .25s ease-out}
@keyframes tin{from{transform:translate(-50%,10px);opacity:0}}

@media (max-width:520px){
  .bar{gap:8px;padding:10px 12px}
  .bar .logo{font-size:24px}
  .chip{padding:4px 9px;font-size:14px}
  .hero h2{font-size:24px}
  .lcard .logo{font-size:56px}
  .modal{place-items:end center;padding:0}
  .sheet{border-radius:22px 22px 0 0;max-height:82vh;padding-top:26px;position:relative;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  .sheet::before{content:"";position:absolute;top:9px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:9px;background:var(--line2)}
}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="login">
  <div class="lcard">
    <div class="logo">R3D<i></i></div>
    <h1>ادخل كود الدخول</h1>
    <p class="sub">المنصة مقفلة، والكود يفتح لك كل الألعاب.</p>
    <form id="lform" autocomplete="off">
      <div class="field" id="lfield">
        <input id="code" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" aria-label="كود الدخول">
        <button class="btn" id="lbtn" type="submit">دخول</button>
      </div>
    </form>
    <div class="msg" id="lmsg" role="status"></div>
    <div class="foot">ما عندك كود؟ اطلبه من صاحب المنصة.</div>
  </div>
</section>

<section id="lib" hidden>
  <header class="bar">
    <div class="logo">R3D<i></i></div>
    <div class="sp"></div>
    <span class="chip" id="chip"></span>
    <button class="btn ghost sm" id="adminBtn" type="button" hidden>الأكواد</button>
    <button class="btn ghost sm" id="outBtn" type="button">خروج</button>
  </header>
  <main class="wrap">
    <div class="hero">
      <h2>مكتبة الألعاب</h2>
      <p id="heroSub"></p>
    </div>
    <div id="alertBox"></div>
    <div class="tools"><div class="seg" id="filter" role="group" aria-label="نوع اللعبة"></div></div>
    <div class="grid" id="grid"></div>
  </main>
</section>

<section id="play" hidden>
  <iframe id="frame" title="اللعبة" allow="autoplay; fullscreen; clipboard-write; web-share"></iframe>
  <div class="loading" id="loading"><div class="sk" style="height:56px"></div><div class="sk" style="height:180px"></div><div class="sk" style="height:44px"></div><div class="sk" style="height:44px"></div></div>
  <button id="back" type="button">→ المكتبة</button>
</section>

<div class="modal" id="admin" hidden>
  <div class="sheet" role="dialog" aria-label="الأكواد المؤقتة">
    <h3>الأكواد المؤقتة</h3>
    <p class="note">كل كود يشتغل ٢٤ ساعة من أول مرة ينكتب، وبعدها يقفل. اضغط على الكود عشان تنسخه، ويتعلّم عليه إنك عطيته. هذي اللوحة تطلع لصاحب الكود الدائم بس.</p>
    <div class="codes" id="codes"></div>
    <div class="row">
      <button class="btn ghost sm" id="resetGiven" type="button">مسح العلامات</button>
      <button class="btn sm" id="closeAdmin" type="button">تم</button>
    </div>
  </div>
</div>

const te = new TextEncoder(), td = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const $ = id => document.getElementById(id);
const DAY = 24 * 3600 * 1000;
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const K_SESSION = 'r3d.session', K_USED = 'r3d.used', K_SEEN = 'r3d.seen', K_GIVEN = 'r3d.given';

/* ---------- الوقت: ساعة السيرفر، وما يرجع لورا ---------- */
let offset = 0;
async function syncTime(){
  try {
    const r = await fetch(location.href.split('#')[0], {method:'HEAD', cache:'no-store'});
    const d = Date.parse(r.headers.get('Date'));
    if (!isNaN(d)) offset = d - Date.now();
  } catch(e){}
}
function now(){
  const t = Math.max(Date.now() + offset, LS.get(K_SEEN, 0));
  LS.set(K_SEEN, t);
  return t;
}

/* ---------- التشفير ---------- */
const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
async function deriveKey(code){
  const base = await crypto.subtle.importKey('raw', te.encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(D.salt), iterations:D.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function rawKey(b){ return crypto.subtle.importKey('raw', b64(b), 'AES-GCM', false, ['decrypt']); }
async function openBox(key, box, asText){
  try {
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(box.iv)}, key, b64(box.ct));
    const s = td.decode(pt);
    return asText ? s : JSON.parse(s);
  } catch(e){ return null; }
}

/* ---------- الجلسة ---------- */
let SES = null, KEY = null, MAN = null;

function expired(s){ return s.t === 't' && now() >= s.exp; }

async function tryCode(code){
  const key = await deriveKey(code);
  for (const w of D.wraps) {
    const p = await openBox(key, w);
    if (!p) continue;
    if (p.t === 'p') return {ok:true, ses:{t:'p', k:p.k, a:p.a}};
    const used = LS.get(K_USED, {});
    const t = now();
    if (used[p.id] && t >= used[p.id] + DAY) return {ok:false, why:'expired'};
    if (!used[p.id]) { used[p.id] = t; LS.set(K_USED, used); }
    return {ok:true, ses:{t:'t', k:p.k, id:p.id, exp:used[p.id] + DAY}};
  }
  return {ok:false, why:'wrong'};
}

async function enter(ses){
  KEY = await rawKey(ses.k);
  MAN = await openBox(KEY, D.manifest);
  if (!MAN) { LS.del(K_SESSION); return false; }
  SES = ses;
  LS.set(K_SESSION, ses);
  showLib();
  return true;
}

function lockOut(why){
  SES = null; KEY = null; MAN = null;
  LS.del(K_SESSION);
  try { sessionStorage.removeItem('r3d.play'); } catch(e){}
  closeGame(true);
  $('lib').hidden = true; $('admin').hidden = true;
  $('login').hidden = false;
  $('code').value = '';
  setMsg(why === 'expired' ? 'خلصت الـ٢٤ ساعة حقت هذا الكود. اطلب كود جديد.' : '', 'err');
}

/* ---------- واجهة الدخول ---------- */
function setMsg(t, cls){ const m = $('lmsg'); m.textContent = t; m.className = 'msg' + (cls ? ' ' + cls : ''); }

$('code').addEventListener('input', e => {
  const v = norm(e.target.value).slice(0, 12);
  e.target.value = v.replace(/(.{4})(?=.)/g, '$1-');
});

$('lform').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('code').value;
  if (norm(code).length < 6) { setMsg('اكتب الكود كامل.', 'err'); return; }
  const btn = $('lbtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  setMsg('جاري التحقق…');
  const r = await tryCode(code);
  if (!r.ok) {
    await new Promise(res => setTimeout(res, 600));
    btn.disabled = false; btn.textContent = 'دخول';
    setMsg(r.why === 'expired' ? 'هذا الكود خلصت مدته (٢٤ ساعة). اطلب كود جديد.' : 'الكود غلط. تأكد منه وجرّب مرة ثانية.', 'err');
    const f = $('lfield'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    return;
  }
  await enter(r.ses);
  btn.disabled = false; btn.textContent = 'دخول';
  toast(r.ses.t === 'p' ? 'أهلاً! المنصة مفتوحة' : 'أهلاً! كودك يشتغل ٢٤ ساعة');
});

/* ---------- المكتبة ---------- */
function fmtLeft(ms){
  ms = Math.max(0, ms);
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000);
  return [h, m, s].map(x => String(x).padStart(2, '0')).join(':');
}
function tick(){
  if (!SES) return;
  if (expired(SES)) { lockOut('expired'); return; }
  const c = $('chip');
  if (SES.t === 'p') { c.className = 'chip perm'; c.innerHTML = '<span class="sd"></span>دخول دائم <b>∞</b>'; }
  else {
    const left = SES.exp - now();
    c.className = 'chip temp'; c.innerHTML = '<span class="sd"></span>باقي <b>' + fmtLeft(left) + '</b>';
    const box = $('alertBox');
    if (left < 3600000 && box && !box.firstChild) box.innerHTML = '<div class="alert" role="status">باقي على كودك أقل من ساعة. لما يخلص العداد تقفل المنصة.</div>';
  }
}
setInterval(tick, 1000);

function progressOf(g){
  if (!g.progress) return null;
  const st = LS.get(g.progress.key, null);
  if (!st || !st.answers) return {n:0, total:g.progress.total, done:false};
  const n = Object.keys(st.answers).filter(k => !g.progress.skip.includes(k)).length;
  return {n:Math.min(n, g.progress.total), total:g.progress.total, done:!!st.finishedAt};
}

let FILTER = 'all';
const KINDS = [['all', 'الكل'], ['solo', 'فردي'], ['group', 'جماعي']];
function showLib(){
  $('login').hidden = true;
  $('lib').hidden = false;
  $('adminBtn').hidden = SES.t !== 'p';
  $('heroSub').textContent = SES.t === 'p'
    ? 'معك الكود الدائم: كل الألعاب مفتوحة لك بدون حد.'
    : 'كودك المؤقت يفتح كل الألعاب لين يخلص العداد فوق.';
  const kindOf = g => g.kind || 'solo';
  $('filter').innerHTML = KINDS.map(([k, n]) => `<button type="button" data-k="${k}" aria-pressed="${FILTER === k}">${n}<span class="n">${k === 'all' ? MAN.games.length : MAN.games.filter(g => kindOf(g) === k).length}</span></button>`).join('');
  $('filter').querySelectorAll('button').forEach(b => b.onclick = () => { FILTER = b.dataset.k; showLib(); });
  const grid = $('grid');
  grid.innerHTML = '';
  const list = MAN.games.filter(g => FILTER === 'all' || kindOf(g) === FILTER);
  for (const g of list) {
    const p = progressOf(g);
    const el = document.createElement('article');
    el.className = 'game ' + kindOf(g) + (p && p.done ? ' done' : '');
    if (g.accent) { el.style.setProperty('--ga', g.accent[0]); el.style.setProperty('--ga-fg', g.accent[1]); }
    const label = g.cta || (!p || p.n === 0 ? 'ابدأ اللعب' : p.done ? 'خلصتها · العب مرة ثانية' : 'كمّل من وين وقفت');
    el.innerHTML = `
      <div class="cover ${g.coverStyle || ''}">
        ${g.cover ? `<img src="${g.cover}" alt="">` : ''}
        ${g.badge ? `<span class="badge">${g.badge}</span>` : ''}
        <div class="ct">${g.coverTitle}<small>${g.coverSub}</small></div>
        <span class="tag">${g.tag}</span>
      </div>
      <div class="gbody">
        <h3>${g.title}</h3>
        <p>${g.desc}</p>
        ${p ? `<div class="prog"><span class="tr"><i style="width:${Math.round(p.n / p.total * 100)}%"></i></span><b>${p.n}/${p.total}</b></div>` : g.meta ? `<div class="meta"><span class="sd"></span>${g.meta}</div>` : ''}
        <button class="btn" type="button">${label}</button>
      </div>`;
    el.querySelector('button').addEventListener('click', () => openGame(g.id));
    el.addEventListener('pointermove', e => { const r = el.getBoundingClientRect(); el.style.setProperty('--mx', (e.clientX - r.left) + 'px'); el.style.setProperty('--my', (e.clientY - r.top) + 'px'); });
    grid.appendChild(el);
  }
  if (!list.length) grid.innerHTML = '<div class="empty"><strong>ما فيه ألعاب هنا للحين</strong>بتنضاف قريب.</div>';
  else if (FILTER === 'all') {
    const soon = document.createElement('div');
    soon.className = 'game soon';
    soon.innerHTML = '<div><div class="plus">+</div><div>ألعاب جديدة جاية قريب</div></div>';
    grid.appendChild(soon);
  }
  tick();
  let want = null;
  try { want = sessionStorage.getItem('r3d.play'); } catch(e){}
  if (want && $('play').hidden && MAN.games.some(g => g.id === want)) openGame(want);
}

/* ---------- اللعب ---------- */
let blobUrl = null;
async function loadBox(ref){
  if (typeof ref !== 'string') return ref;
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(ref); if (r.ok) return await r.json(); } catch(e){}
    await new Promise(r => setTimeout(r, 600 * (i + 1)));
  }
  return null;
}
async function openGame(id){
  const ref = D.games[id];
  if (!ref) return;
  const g = MAN.games.find(x => x.id === id) || {};
  $('back').hidden = g.ownBack === true;
  $('loading').classList.remove('gone');
  $('frame').onload = null;
  $('frame').src = 'about:blank';
  $('play').hidden = false;
  document.body.style.overflow = 'hidden';
  const box = await loadBox(ref);
  const html = box && await openBox(KEY, box, true);
  if (!html) { closeGame(true); showLib(); toast('ما قدرنا نفتح اللعبة، تأكد من النت وجرّب مرة ثانية'); return; }
  if ($('play').hidden) return;
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'}));
  $('frame').onload = () => setTimeout(() => $('loading').classList.add('gone'), 150);
  $('frame').src = blobUrl;
  try { sessionStorage.setItem('r3d.play', id); } catch(e){}
}
function closeGame(silent){
  $('play').hidden = true;
  $('frame').src = 'about:blank';
  document.body.style.overflow = '';
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
  try { sessionStorage.removeItem('r3d.play'); } catch(e){}
  if (!silent && SES) showLib();
}
$('back').addEventListener('click', () => closeGame());
window.addEventListener('message', e => { if (e.origin === location.origin && e.data === 'r3d:back' && !$('play').hidden) closeGame(); });

$('outBtn').addEventListener('click', () => lockOut());

/* ---------- لوحة الأكواد (للكود الدائم بس) ---------- */
let toastT;
function toast(t){
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 1600);
}
async function renderCodes(){
  if (SES.t !== 'p') return;
  const list = await openBox(await rawKey(SES.a), D.admin);
  if (!list) return;
  const given = LS.get(K_GIVEN, {});
  const used = LS.get(K_USED, {});
  const box = $('codes');
  box.innerHTML = '';
  list.forEach((c, i) => {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'code' + (given[c.id] ? ' given' : '');
    const u = used[c.id];
    const st = given[c.id] ? 'عطيته' : u ? 'انستخدم هنا' : 'جديد';
    row.innerHTML = `<span class="n">${i + 1}</span><span class="v">${c.code}</span><span class="st">${st}</span>`;
    row.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(c.code); toast('تم النسخ'); } catch(e){ toast(c.code); }
      const g = LS.get(K_GIVEN, {}); g[c.id] = Date.now(); LS.set(K_GIVEN, g);
      renderCodes();
    });
    box.appendChild(row);
  });
}
$('adminBtn').addEventListener('click', async () => { await renderCodes(); $('admin').hidden = false; });
$('closeAdmin').addEventListener('click', () => $('admin').hidden = true);
$('admin').addEventListener('click', e => { if (e.target.id === 'admin') $('admin').hidden = true; });
$('resetGiven').addEventListener('click', () => { LS.del(K_GIVEN); renderCodes(); });

/* ---------- Text Scramble على الشعار ---------- */
function scramble(el, final){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const chars = 'R3D#X7%&@0Z9K', node = el.firstChild;
  if (!node || node.nodeType !== 3) return;
  let f = 0;
  const id = setInterval(() => {
    f++;
    node.textContent = [...final].map((c, i) => f > 6 + i * 4 ? c : chars[Math.floor(Math.random() * chars.length)]).join('');
    if (f > 6 + final.length * 4) { clearInterval(id); node.textContent = final; }
  }, 45);
}
document.querySelectorAll('.logo').forEach(l => scramble(l, 'R3D'));

/* ---------- التشغيل ---------- */
(async function boot(){
  await syncTime();
  const s = LS.get(K_SESSION, null);
  if (s && s.k) {
    if (expired(s)) { lockOut('expired'); return; }
    if (await enter(s)) return;
  }
  $('code').focus();
})();
</script>
