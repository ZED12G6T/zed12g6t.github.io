/* عمود واحد بعرض جوال: شريط فوق، والمرحلة الحالية تحته، والأزرار تحت بعضها. */
:root{
  --bg:#09090b; --bg2:#101014; --panel:#141418; --panel2:#1c1c21; --line:#2a2a31; --line2:#3a3a43;
  --fg:#f5f5f7; --mute:#a3a3ae; --dim:#6b6b76;
  --acc:#e3122f; --spy:#b07cff; --spy-bg:#b07cff1f; --ok:#36d39a; --warn:#ffb020; --bad:#ff4d63;
  --ar:'Lifta','Anton',system-ui,sans-serif; --lat:'Anton','Lifta',Impact,sans-serif; --num:'Bebas Neue','Anton','Lifta',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(800px 480px at 50% -10%,#6d3bd433,transparent 65%) no-repeat,var(--bg);color:var(--fg);font-family:var(--ar);font-size:18px;line-height:1.7;font-synthesis:none;-webkit-tap-highlight-color:transparent}
h1,h2,h3,b,strong,button{font-weight:400}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--spy);outline-offset:3px;border-radius:10px}
.num{font-family:var(--num);direction:ltr;unicode-bidi:isolate;letter-spacing:.04em}
.lat{font-family:var(--lat);direction:ltr;unicode-bidi:isolate}

.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px));background:#09090bd9;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-size:24px;line-height:1}
.bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:15px;white-space:nowrap}
.chip .num{font-size:18px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.mid{background:var(--warn);animation:blink 1.2s infinite}
.dot.off{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}

main{max-width:560px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 190px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:22px;line-height:1.3}
.card .sub{margin:0;color:var(--mute);font-size:16px}
.label{font-size:15px;color:var(--dim)}
.hero{text-align:center;padding:10px 0 4px;display:flex;flex-direction:column;gap:4px;align-items:center}
.hero h2{margin:0;font-size:32px;line-height:1.3;text-wrap:balance}
.hero p{margin:0;color:var(--mute);font-size:17px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 18px;border-radius:14px;background:var(--spy);color:#140a24;font-size:19px;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.red{background:var(--acc);color:#fff}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--fg)}
.btn.sm{width:auto;padding:7px 14px;font-size:16px;border-radius:11px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.helper{font-size:15px;color:var(--dim);text-align:center}

.field{display:flex;flex-direction:column;gap:6px}
.field input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font-size:20px;outline:none}
.field input:focus{border-color:var(--spy);box-shadow:0 0 0 4px var(--spy-bg)}

.linkbox{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg2);border:1px dashed var(--line2)}
.linkbox code{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--mute);direction:ltr;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* لاعبين */
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.pl.me{border-color:#b07cff66}
.pl.away{opacity:.5}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none;color:#0b0b0e;overflow:hidden;line-height:1}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:13px;padding:0 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.badge.host{color:var(--warn);border-color:#ffb02055}
.badge.ok{color:var(--ok);border-color:#36d39a55}
.pl .pts{font-family:var(--num);font-size:20px;direction:ltr;min-width:36px;text-align:left}

/* إعدادات */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:15px;color:var(--mute)}
.chips button[aria-pressed="true"]{background:var(--spy);border-color:var(--spy);color:#140a24}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.seg button{padding:4px 16px;border-radius:9px;color:var(--mute);font-size:16px}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:0 1px 0 #fff1 inset}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line2);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--spy)}
.switch[aria-checked="true"]::after{transform:translateX(-20px)}

/* بطاقة الدور */
.role{position:relative;min-height:190px;border-radius:20px;display:grid;place-items:center;text-align:center;padding:18px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.role.hidden{background:repeating-linear-gradient(45deg,#1d1730 0 10px,#221b38 10px 20px);border:1px solid #b07cff44;color:var(--spy)}
.role.civ{background:linear-gradient(160deg,#173826,#0f1f17);border:1px solid #36d39a55}
.role.spyr{background:linear-gradient(160deg,#3a1226,#1e0b15);border:1px solid #ff4d6355}
.role .k{font-size:15px;color:var(--mute)}
.role .w{font-size:40px;line-height:1.25;margin:4px 0}
.role .h{font-size:15px;opacity:.75}
.mini{display:flex;align-items:center;gap:8px;justify-content:center;font-size:16px;color:var(--mute)}
.mini button{color:var(--spy);text-decoration:underline;text-underline-offset:4px}

/* ترتيب الأسئلة */
.now{text-align:center;padding:14px;border-radius:18px;background:var(--spy-bg);border:1px solid #b07cff55}
.now .k{font-size:15px;color:var(--mute)}
.now .pair{font-size:30px;line-height:1.35}
.now .pair i{font-style:normal;color:var(--spy);margin:0 6px}
.prog{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--spy);border-radius:9px;transition:width .3s}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.order li{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;font-size:17px}
.order li .n{font-family:var(--num);font-size:18px;color:var(--dim);width:22px;text-align:center}
.order li.done{color:var(--dim);text-decoration:line-through}
.order li.cur{background:var(--panel2);color:var(--fg);box-shadow:inset -3px 0 0 var(--spy)}
.order li .ar{color:var(--spy)}

/* التصويت */
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vbtn{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);text-align:right;min-width:0}
.vbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn[aria-pressed="true"]{border-color:var(--spy);background:var(--spy-bg);box-shadow:0 0 0 3px #b07cff33}
.tally{display:flex;flex-direction:column;gap:6px}
.tr{display:grid;grid-template-columns:minmax(0,7em) 1fr auto;gap:8px;align-items:center;font-size:16px}
.tr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .bar2{height:10px;border-radius:9px;background:var(--panel2);overflow:hidden}
.tr .bar2 i{display:block;height:100%;background:var(--line2);border-radius:9px}
.tr.spy .bar2 i{background:var(--bad)}
.tr .num{font-size:18px}

<script>
const MODE = 'join';
const BANK = null;
const BROKERS = (() => { try { const o = JSON.parse(localStorage.getItem('r3d.spy.brokers')); if (Array.isArray(o) && o.length) return o; } catch(e){} return ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt']; })();
const te = new TextEncoder(), td = new TextDecoder();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR = n => String(n);
const rid = n => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (const b of crypto.getRandomValues(new Uint8Array(n))) s += a[b % a.length]; return s; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[crypto.getRandomValues(new Uint32Array(1))[0] % a.length];
const b64u = u => btoa(String.fromCharCode(...u)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const COLORS = ['#b07cff','#36d39a','#ffb020','#6aa8ff','#ff7aa8','#4fd1c5','#f6a35b','#c3e66b','#ff8f6b','#9aa7ff'];
const colorOf = id => COLORS[[...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % COLORS.length];
const avatar = p => `<span class="av" style="background:${colorOf(p.id)}">${esc([...p.name][0] || '؟')}</span>`;

/* ---------- عميل MQTT صغير على WebSocket (QoS 0) ---------- */
class MQ {
  constructor(url, onMsg, onState){ this.url = url; this.onMsg = onMsg; this.onState = onState; this.subs = new Set(); this.q = []; this.ok = false; this.buf = new Uint8Array(0); this.tries = 0; this.open(); }
  str(s){ const b = te.encode(s); return [b.length >> 8, b.length & 255, ...b]; }
  pkt(h, body){ const len = []; let n = body.length; do { let d = n % 128; n = Math.floor(n / 128); if (n) d |= 128; len.push(d); } while (n); return new Uint8Array([h, ...len, ...body]); }
  open(){
    this.onState('connecting');
    let ws;
    try { ws = new WebSocket(this.url, ['mqtt']); } catch(e){ return this.retry(); }
    ws.binaryType = 'arraybuffer';
    this.ws = ws;
    ws.onopen = () => ws.send(this.pkt(0x10, [...this.str('MQTT'), 4, 2, 0, 45, ...this.str('r3d' + rid(10))]));
    ws.onmessage = e => this.feed(new Uint8Array(e.data));
    ws.onclose = () => { this.ok = false; clearInterval(this.ping); this.onState('down'); this.retry(); };
    ws.onerror = () => {};
  }
  retry(){ if (this.closed) return; this.tries++; setTimeout(() => this.open(), Math.min(8000, 600 * this.tries)); }
  feed(chunk){
    const b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length); this.buf = b;
    for (;;) {
      if (this.buf.length < 2) return;
      let mul = 1, len = 0, i = 1, d;
      do { if (i >= this.buf.length) return; d = this.buf[i++]; len += (d & 127) * mul; mul *= 128; } while (d & 128);
      if (this.buf.length < i + len) return;
      const h = this.buf[0], body = this.buf.slice(i, i + len);
      this.buf = this.buf.slice(i + len);
      const type = h >> 4;
      if (type === 2) {
        if (body[1] !== 0) { this.onState('down'); continue; }
        this.ok = true; this.tries = 0; this.onState('up');
        for (const t of this.subs) this.sendSub(t);
        const q = this.q; this.q = []; q.forEach(p => this.ws.send(p));
        clearInterval(this.ping); this.ping = setInterval(() => this.ok && this.ws.send(new Uint8Array([0xC0, 0])), 25000);
      } else if (type === 3) {
        const tl = (body[0] << 8) | body[1];
        const topic = td.decode(body.slice(2, 2 + tl));
        const qos = (h >> 1) & 3;
        this.onMsg(topic, body.slice(2 + tl + (qos ? 2 : 0)));
      }
    }
  }
  sendSub(t){ this.ws.send(this.pkt(0x82, [0, 1 + (this.subs.size % 60000), ...this.str(t), 0])); }
  sub(t){ this.subs.add(t); if (this.ok) this.sendSub(t); }
  pub(t, payload, retain){
    const p = this.pkt(0x30 | (retain ? 1 : 0), [...this.str(t), ...payload]);
    if (this.ok) this.ws.send(p); else this.q.push(p);
  }
  close(){ this.closed = true; try { this.ws.send(new Uint8Array([0xE0, 0])); this.ws.close(); } catch(e){} }
}

/* ---------- التشفير ---------- */
const C = {
  async aes(raw){ return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']); },
  async enc(key, obj){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj))));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
  },
  async dec(key, bytes){
    try { return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes.slice(0, 12)}, key, bytes.slice(12)))); }
    catch(e){ return null; }
  },
  async pair(){ return crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveKey']); },
  async exp(k){ return crypto.subtle.exportKey('jwk', k); },
  async impPriv(j){ return crypto.subtle.importKey('jwk', j, {name:'ECDH', namedCurve:'P-256'}, true, ['deriveKey']); },
  async impPub(j){ return crypto.subtle.importKey('jwk', j, {name:'ECDH', namedCurve:'P-256'}, true, []); },
  async shared(priv, pubJwk){ return crypto.subtle.deriveKey({name:'ECDH', public: await C.impPub(pubJwk)}, priv, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']); }
};

/* ---------- الواجهة المشتركة ---------- */
let S = null;        // الحالة العامة (من المؤسس)
let ME = null;       // {id, name}
let PRIV = null;     // دوري الخاص في الجولة
let UI = {peek:false, vote:null, guess:null, cat:null};
let NET = 'connecting';

function toast(t){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
  $('toasts').appendChild(el); setTimeout(() => el.remove(), 2200);
}
function setNet(s){
  NET = s;
  const d = $('netDot'), t = $('netTxt');
  d.className = 'dot ' + (s === 'up' ? 'on' : s === 'down' ? 'off' : 'mid');
  t.textContent = s === 'up' ? 'متصل' : s === 'down' ? 'انقطع' : 'يتصل…';
}
const player = id => S && S.players.find(p => p.id === id);
const nameOf = id => (player(id) || {}).name || '؟';
const isHost = () => MODE === 'host';
const inRound = () => S.players.filter(p => p.inRound);
const totalTurns = () => S.order.length * S.settings.laps;
const pairAt = i => { const n = S.order.length; const a = S.order[i % n], b = S.order[(i + 1) % n]; return [a, b]; };
async function copy(t){ try { await navigator.clipboard.writeText(t); toast('تم النسخ'); } catch(e){ toast('ما قدرت أنسخ، انسخه يدوي'); } }

function skeleton(){
  $('app').innerHTML = `<div class="sk" style="height:60px"></div><div class="sk" style="height:150px"></div><div class="sk" style="height:44px"></div><div class="sk" style="height:44px"></div>`;
  $('foot').hidden = true;
}

function playersCard(showScore){
  const ps = S.players.slice().sort((a, b) => showScore ? b.score - a.score : 0);
  return `<div class="card"><div class="setrow"><h2>اللاعبين <span class="num">${ps.filter(p => p.on).length}</span></h2>${S.phase !== 'lobby' ? '<span class="label">النقاط</span>' : ''}</div>
    <div class="plist">${ps.map(p => `
      <div class="pl ${p.id === ME.id ? 'me' : ''} ${p.on ? '' : 'away'}">
        ${avatar(p)}<span class="nm">${esc(p.name)}${p.id === ME.id ? ' <span class="label">(أنت)</span>' : ''}</span>
        ${p.id === S.hostId ? '<span class="badge host">المؤسس</span>' : ''}
        ${!p.on ? '<span class="badge">غير متصل</span>' : ''}
        ${S.phase !== 'lobby' && !p.inRound ? '<span class="badge">ينتظر الجولة الجاية</span>' : ''}
        ${S.phase === 'reveal' && p.inRound && p.ready ? '<span class="badge ok">جاهز</span>' : ''}
        ${S.phase === 'vote' && p.inRound && p.voted ? '<span class="badge ok">صوّت</span>' : ''}
        <span class="dot ${p.on ? 'on' : ''}"></span>
        ${S.phase !== 'lobby' ? `<span class="pts">${p.score}</span>` : ''}
      </div>`).join('')}</div></div>`;
}

function roleCard(){
  if (!PRIV || PRIV.round !== S.round) return `<div class="role hidden"><div><div class="w" style="font-size:22px">يجيك دورك…</div></div></div>`;
  if (!UI.peek) return `<button class="role hidden" id="peek" type="button"><div><div class="k">دورك مخفي</div><div class="w" style="font-size:26px">اضغط عشان تشوفه</div><div class="h">لا تخلي أحد يشوف شاشتك</div></div></button>`;
  if (PRIV.role === 'spy') return `<button class="role spyr" id="peek" type="button"><div><div class="k">دورك</div><div class="w">أنت الجاسوس</div><div class="h">${PRIV.cat ? 'الفئة: ' + esc(PRIV.cat) + ' · ' : ''}حاول تعرف الموضوع بدون ما تنكشف</div></div></button>`;
  return `<button class="role civ" id="peek" type="button"><div><div class="k">الموضوع${PRIV.cat ? ' · ' + esc(PRIV.cat) : ''}</div><div class="w">${esc(PRIV.topic)}</div><div class="h">اسأل وجاوب بذكاء، لا تفضحه للجاسوس</div></div></button>`;
}

function render(){
  if (!S || !ME) return;
  $('roundChip').hidden = S.phase === 'lobby' || S.phase === 'closed';
  $('roundNum').textContent = AR(S.round);
  const app = $('app'), foot = $('footIn');
  let h = '', f = '';
  const hostAway = !isHost() && S.hostSeen && Date.now() - S.hostSeen > 30000;
  if (hostAway) h += `<div class="banner bad"><span class="dot off"></span>المؤسس غير متصل الحين. اللعبة تكمل أول ما يرجع.</div>`;
  const meP = player(ME.id) || {};

  if (S.phase === 'closed') {
    h += `<div class="hero"><h2>الغرفة انقفلت</h2><p>المؤسس أنهى الغرفة. شكراً على اللعب!</p></div>` + playersCard(true);
  }
  else if (S.phase === 'lobby') {
    h += `<div class="hero"><h2>${isHost() ? 'غرفتك جاهزة' : 'أنت في الغرفة'}</h2><p>${isHost() ? 'أرسل الرابط لربعك، ويدخلون بدون كود.' : 'ننتظر المؤسس يبدأ الجولة…'}</p></div>`;
    if (isHost()) h += `<div class="card"><span class="label">رابط الغرفة</span><div class="linkbox"><code>${esc(HOST.link)}</code></div>
      <div class="row"><button class="btn sm ghost" id="copyLink" type="button">انسخ الرابط</button>${navigator.share ? '<button class="btn sm ghost" id="shareLink" type="button">شارك</button>' : ''}</div></div>`;
    h += playersCard(false);
    h += settingsCard();
    if (isHost()) {
      const n = S.players.filter(p => p.on).length;
      f += `<button class="btn" id="start" type="button" ${n < 3 ? 'disabled' : ''}>ابدأ الجولة</button>${n < 3 ? `<div class="helper">تحتاجون ٣ لاعبين على الأقل (الحين ${AR(n)})</div>` : ''}`;
    }
  }
  else if (S.phase === 'reveal') {
    h += `<div class="hero"><h2>شوف دورك</h2><p>كل واحد يشوف دوره بروحه، وبعدها يضغط «جاهز».</p></div>`;
    if (meP.inRound) {
      h += roleCard();
      const rd = inRound().filter(p => p.ready).length;
      f += meP.ready ? `<div class="helper">جاهز. ننتظر الباقين (${AR(rd)}/${AR(inRound().length)})</div>` : `<button class="btn" id="ready" type="button" ${PRIV && PRIV.round === S.round ? '' : 'disabled'}>جاهز</button>`;
    } else h += `<div class="banner">دخلت والجولة بادية. تلعب من الجولة الجاية.</div>`;
    if (isHost()) f += `<button class="btn ghost" id="forceQ" type="button">ابدأ الأسئلة الحين</button>`;
    h += playersCard(true);
  }
  else if (S.phase === 'questions') {
    const tot = totalTurns(), [a, b] = pairAt(S.turn);
    h += `<div class="now"><div class="k">السؤال <span class="num">${AR(S.turn + 1)}</span> من <span class="num">${AR(tot)}</span></div><div class="pair">${esc(nameOf(a))}<i>يسأل</i>${esc(nameOf(b))}</div></div>`;
    h += `<div class="prog"><i style="width:${Math.round(S.turn / tot * 100)}%"></i></div>`;
    if (meP.inRound) h += `<div class="mini">${UI.peek ? (PRIV && PRIV.role === 'spy' ? 'أنت <b style="color:var(--bad)">الجاسوس</b>' : `الموضوع: <b style="color:var(--ok)">${esc(PRIV && PRIV.topic)}</b>`) : 'دورك مخفي'} · <button id="peekMini" type="button">${UI.peek ? 'خبّه' : 'شوفه'}</button></div>`;
    h += `<div class="card"><span class="label">ترتيب الأسئلة (يشوفه الكل)</span><ol class="order">${Array.from({length: tot}, (_, i) => { const [x, y] = pairAt(i); return `<li class="${i < S.turn ? 'done' : i === S.turn ? 'cur' : ''}"><span class="n">${AR(i + 1)}</span>${esc(nameOf(x))} <span class="ar">←</span> ${esc(nameOf(y))}</li>`; }).join('')}</ol></div>`;
    if (a === ME.id || isHost()) f += `<button class="btn" id="next" type="button">${a === ME.id ? 'خلّصت سؤالي' : 'السؤال التالي'}</button>`;
    else f += `<div class="helper">الدور على ${esc(nameOf(a))}</div>`;
    if (isHost()) f += `<button class="btn ghost" id="toVote" type="button">روحوا للتصويت</button>`;
  }
  else if (S.phase === 'vote') {
    const vd = inRound().filter(p => p.voted).length;
    h += `<div class="hero"><h2>مين الجاسوس؟</h2><p>كل واحد يصوّت بروحه. اللي يصوّت صح ياخذ <span class="num">100</span> نقطة.</p></div>`;
    if (meP.inRound && !meP.voted) {
      h += `<div class="vgrid">${inRound().filter(p => p.id !== ME.id).map(p => `<button class="vbtn" type="button" data-vote="${esc(p.id)}" aria-pressed="${UI.vote === p.id}">${avatar(p)}<span>${esc(p.name)}</span></button>`).join('')}</div>`;
      f += `<button class="btn" id="castVote" type="button" ${UI.vote ? '' : 'disabled'}>ثبّت صوتي</button>`;
    } else if (meP.inRound) h += `<div class="banner" style="justify-content:center">صوتك انحفظ. ننتظر الباقين (${AR(vd)}/${AR(inRound().length)})</div>`;
    h += playersCard(true);
    if (isHost()) f += `<button class="btn ghost" id="reveal" type="button">اكشف النتيجة${vd < inRound().length ? ` (${AR(vd)}/${AR(inRound().length)})` : ''}</button>`;
  }
  else if (S.phase === 'guess' || S.phase === 'result') {
    const R = S.result;
    const spyName = esc(nameOf(R.spyId));
    h += `<div class="verdict ${R.caught ? 'caught' : 'free'}"><span class="label">الجاسوس كان</span><h2>${spyName}</h2><p>${R.caught ? 'انكشف! أكثر واحد جاه تصويت.' : 'ما انكشف، وأخذ ' + '<span class="num">100</span>' + ' نقطة.'}</p></div>`;
    const max = Math.max(1, ...Object.values(R.tally));
    h += `<div class="card"><span class="label">الأصوات</span><div class="tally">${inRound().map(p => { const n = R.tally[p.id] || 0; const voters = Object.keys(R.votes).filter(v => R.votes[v] === p.id).map(nameOf).join('، '); return `<div class="tr ${p.id === R.spyId ? 'spy' : ''}"><span class="nm">${esc(p.name)}</span><span class="bar2"><i style="width:${n / max * 100}%"></i></span><span class="num">${n}</span></div>${voters ? `<div class="label" style="margin-top:-4px">صوّت له: ${esc(voters)}</div>` : ''}`; }).join('')}</div></div>`;
    if (S.phase === 'guess') {
      if (ME.id === R.spyId && PRIV && PRIV.options) {
        h += `<div class="card"><h2>دورك يا جاسوس: وش كان الموضوع؟</h2><p class="sub">لو خمّنت صح تاخذ <span class="num">150</span> نقطة.</p><div class="opts">${PRIV.options.map(w => `<button type="button" data-guess="${esc(w)}" aria-pressed="${UI.guess === w}">${esc(w)}</button>`).join('')}</div></div>`;
        f += `<button class="btn" id="castGuess" type="button" ${UI.guess ? '' : 'disabled'}>هذا جوابي</button>`;
      } else {
        h += `<div class="card"><h2>${spyName} يخمّن الموضوع الحين…</h2><div class="sk" style="height:44px"></div></div>`;
        if (isHost()) f += `<button class="btn ghost" id="skipGuess" type="button">تخطّى تخمين الجاسوس</button>`;
      }
    } else {
      h += `<div class="card" style="text-align:center"><span class="label">الموضوع كان</span><h2 style="font-size:34px">${esc(R.topic)}</h2>
        <p class="sub">${R.guess == null ? 'الجاسوس ما خمّن.' : R.guessOk ? `الجاسوس خمّن «${esc(R.guess)}» صح، وأخذ <span class="num">150</span>.` : `الجاسوس خمّن «${esc(R.guess)}» وطلع غلط.`}</p></div>`;
      const ds = Object.entries(R.delta).filter(([, v]) => v > 0);
      if (ds.length) h += `<div class="card"><span class="label">نقاط الجولة</span><div class="plist">${ds.map(([id, v]) => `<div class="pl">${avatar(player(id) || {id, name:'؟'})}<span class="nm">${esc(nameOf(id))}</span><span class="plus">+${v}</span></div>`).join('')}</div></div>`;
      h += playersCard(true);
      if (isHost()) f += `<button class="btn" id="newRound" type="button">جولة جديدة</button><button class="btn ghost" id="endRoom" type="button">إنهاء الغرفة</button>`;
      else f += `<div class="helper">ننتظر المؤسس يبدأ جولة جديدة…</div>`;
    }
  }
  app.innerHTML = h;
  foot.innerHTML = f;
  $('foot').hidden = !f;
  bind();
}

function settingsCard(){
  const st = S.settings, cats = S.cats || [];
  if (!isHost()) {
    const cn = st.cat === 'random' ? 'عشوائي' : (cats.find(c => c.id === st.cat) || {}).name;
    return `<div class="card"><span class="label">إعدادات الغرفة</span><div class="sub">الفئة: ${esc(cn)} · الجاسوس ${st.spyKnowsCat ? 'يعرف' : 'ما يعرف'} الفئة · ${st.laps === 2 ? 'لفّتين' : 'لفّة وحدة'} أسئلة</div></div>`;
  }
  return `<div class="card"><span class="label">الفئة</span>
    <div class="chips">${[{id:'random', name:'عشوائي'}, ...cats].map(c => `<button type="button" data-cat="${c.id}" aria-pressed="${st.cat === c.id}">${esc(c.name)}${c.n ? ` <span class="num" style="opacity:.6">${c.n}</span>` : ''}</button>`).join('')}</div>
    <div class="setrow"><span>الجاسوس يعرف الفئة</span><button class="switch" type="button" role="switch" id="spyCat" aria-checked="${st.spyKnowsCat}" aria-label="الجاسوس يعرف الفئة"></button></div>
    <div class="setrow"><span>لفّات الأسئلة</span><div class="seg"><button type="button" data-laps="1" aria-pressed="${st.laps === 1}">وحدة</button><button type="button" data-laps="2" aria-pressed="${st.laps === 2}">ثنتين</button></div></div></div>`;
}

function bind(){
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('peek', () => { UI.peek = !UI.peek; render(); });
  on('peekMini', () => { UI.peek = !UI.peek; render(); });
  on('copyLink', () => copy(HOST.link));
  on('shareLink', () => navigator.share({title:'الجاسوس · R3D', text:'تعال العب معنا الجاسوس', url:HOST.link}).catch(() => {}));
  on('ready', () => act({t:'ready'}));
  on('next', () => act({t:'next', turn:S.turn}));
  on('castVote', () => { if (UI.vote) act({t:'vote', target:UI.vote}); });
  on('castGuess', () => { if (UI.guess) act({t:'guess', word:UI.guess}); });
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => { UI.vote = b.dataset.vote; render(); });
  document.querySelectorAll('[data-guess]').forEach(b => b.onclick = () => { UI.guess = b.dataset.guess; render(); });
  if (isHost()) hostBind(on);
}

/* ======================================================================
   المؤسس: يملك الحالة، يوزّع الأدوار، ويحسب النقاط
   ====================================================================== */
const HKEY = 'r3d.spy.host.v1';
let HOST = null;   // {room, K, b, link, priv, pubJwk, H:{...secrets}, pubs:{}, keys:{}, seen:{}}
let MQC = null, KEY = null, BASE = '';

async function hostBoot(){
  const saved = LS.get(HKEY, null);
  if (saved && saved.S && saved.S.phase !== 'closed') { await hostResume(saved); return; }
  hostCreateScreen(LS.get('r3d.spy.hostname', ''));
}

function hostCreateScreen(prevName){
  setNet('idle'); $('netTxt').textContent = 'ما فيه غرفة'; $('netDot').className = 'dot';
  $('app').innerHTML = `<div class="hero"><h2>سوّ غرفة جديدة</h2><p>أنت المؤسس. تفعيلك بالكود يكفي، والباقين يدخلون من الرابط.</p></div>
    <div class="card"><div class="field"><label class="label" for="hname">اسمك في اللعبة</label><input id="hname" maxlength="16" autocomplete="off" value="${esc(prevName || '')}" placeholder="مثلاً: مجاهد"></div></div>
    <div class="card"><span class="label">كيف تنلعب</span><div class="sub">١. ترسل الرابط ويدخلون. ٢. كل واحد يشوف دوره، والجاسوس ما يعرف الموضوع. ٣. تسألون بعض بالترتيب اللي يطلع للكل. ٤. تصوّتون، واللي يصوّت صح ياخذ نقاط. ٥. الجاسوس يخمّن الموضوع.</div></div>`;
  $('footIn').innerHTML = `<button class="btn" id="create" type="button">سوّ الغرفة</button>`;
  $('foot').hidden = false;
  const go = async () => {
    const name = $('hname').value.trim();
    if (!name) { $('hname').focus(); toast('اكتب اسمك أول'); return; }
    $('create').disabled = true;
    LS.set('r3d.spy.hostname', name);
    await hostCreate(name);
  };
  $('create').onclick = go;
  $('hname').onkeydown = e => { if (e.key === 'Enter') go(); };
}

function joinBase(){
  let base;
  try { base = parent.location.href.split('#')[0]; } catch(e){ base = location.href.split('#')[0]; }
  if (base.startsWith('blob:') || base.startsWith('about:')) base = location.origin + '/';
  return new URL('spy/', base.endsWith('/') ? base : base.replace(/[^/]*$/, '')).href;
}

async function hostCreate(name){
  const kp = await C.pair();
  const room = rid(10), K = crypto.getRandomValues(new Uint8Array(16));
  const hostId = 'h' + rid(7);
  const cats = Object.entries(BANK).map(([id, c]) => ({id, name:c.name, n:c.words.length}));
  const st = {v:1, room, hostId, hostPub: await C.exp(kp.publicKey), hostSeen: Date.now(), phase:'lobby', round:0,
    settings:{cat:'random', spyKnowsCat:true, laps:1}, cats,
    players:[{id:hostId, name, score:0, on:true, inRound:false, ready:false, voted:false}], order:[], turn:0, result:null};
  HOST = {room, K: b64u(K), b: 0, name, priv: await C.exp(kp.privateKey), pubJwk: st.hostPub, H:{used:[]}, pubs:{}, seen:{}};
  S = st;
  await hostConnect(true);
}

async function hostResume(saved){
  HOST = saved; S = saved.S;
  await hostConnect(false);
}

async function hostConnect(fresh){
  skeleton();
  KEY = await C.aes(unb64u(HOST.K));
  HOST.privKey = await C.impPriv(HOST.priv);
  HOST.keys = {};
  ME = {id: S.hostId, name: nameOf(S.hostId)};
  let idx = HOST.b || 0;
  const tryBroker = i => new Promise(res => {
    let done = false;
    const m = new MQ(BROKERS[i], hostOnMsg, s => { setNet(s); if (s === 'up' && !done) { done = true; res(m); } });
    setTimeout(() => { if (!done) { done = true; m.close(); res(null); } }, fresh ? 7000 : 15000);
  });
  let m = await tryBroker(idx);
  if (!m && fresh) for (let i = 0; i < BROKERS.length && !m; i++) if (i !== idx) { m = await tryBroker(i); if (m) idx = i; }
  if (!m) {
    $('app').innerHTML = `<div class="hero"><h2>ما قدرت أتصل</h2><p>تأكد من النت وجرّب مرة ثانية.</p></div>`;
    $('footIn').innerHTML = `<button class="btn" id="retry" type="button">جرّب مرة ثانية</button>`; $('foot').hidden = false;
    $('retry').onclick = () => location.reload();
    return;
  }
  // الاتصال الأول نجح؛ نعيد ربط معالج الحالة لإعادة الاتصال التلقائي
  m.onState = s => setNet(s);
  MQC = m; HOST.b = idx;
  BASE = `r3d-spy/v1/${HOST.room}`;
  HOST.link = `${joinBase()}#${HOST.room}.${HOST.K}.${idx}`;
  MQC.sub(BASE + '/i');
  for (const p of S.players) if (HOST.pubs[p.id]) HOST.keys[p.id] = await C.shared(HOST.privKey, HOST.pubs[p.id]);
  await hostPublish();
  if (S.phase !== 'lobby') await hostSendPrivates();
  hostSelfPriv();
  setInterval(hostTick, 5000);
  render();
}

function hostSave(){ const {privKey, keys, ...rest} = HOST; LS.set(HKEY, {...rest, S}); }

async function hostPublish(){
  S.hostSeen = Date.now();
  hostSave();
  if (MQC) MQC.pub(BASE + '/s', await C.enc(KEY, S), true);
  render();
}

function hostTick(){
  const now = Date.now();
  let changed = false;
  for (const p of S.players) {
    if (p.id === S.hostId) continue;
    const on = now - (HOST.seen[p.id] || 0) < 25000;
    if (p.on !== on) { p.on = on; changed = true; if (!on) toast(`${p.name} طلع`); }
  }
  // نبضة: نحدّث hostSeen كل ١٥ ثانية حتى لو ما تغيّر شي
  if (changed || now - S.hostSeen > 15000) hostPublish();
}

function privFor(id){
  const H = HOST.H;
  if (!S.players.find(p => p.id === id && p.inRound)) return null;
  const spy = id === H.spyId;
  const o = {round:S.round, role: spy ? 'spy' : 'civ'};
  if (!spy) { o.topic = H.topic; o.cat = H.catName; }
  else { if (S.settings.spyKnowsCat) o.cat = H.catName; if (S.phase === 'guess') o.options = H.options; }
  return o;
}
async function hostSendPrivates(){
  for (const p of S.players) {
    if (p.id === S.hostId || !HOST.keys[p.id]) continue;
    const o = privFor(p.id);
    if (o) MQC.pub(`${BASE}/p/${p.id}`, await C.enc(HOST.keys[p.id], o), true);
  }
  hostSelfPriv();
}
function hostSelfPriv(){ if (S.phase !== 'lobby') PRIV = privFor(S.hostId); }

async function hostOnMsg(topic, bytes){
  if (topic !== BASE + '/i') return;
  const m = await C.dec(KEY, bytes);
  if (!m) return;
  if (m.join) {
    const {pid, name, pub} = m.join;
    if (!/^p[a-z0-9]{7}$/.test(pid || '') || !pub || typeof name !== 'string') return;
    const nm = name.trim().slice(0, 16) || 'لاعب';
    if (HOST.pubs[pid] && JSON.stringify(HOST.pubs[pid]) !== JSON.stringify(pub)) return;
    let p = player(pid);
    HOST.seen[pid] = Date.now();
    if (!HOST.keys[pid]) { HOST.pubs[pid] = pub; HOST.keys[pid] = await C.shared(HOST.privKey, pub); }
    if (!p) { S.players.push({id:pid, name:nm, score:0, on:true, inRound:false, ready:false, voted:false}); toast(`${nm} دخل الغرفة`); }
    else { if (!p.on) toast(`${nm} رجع`); p.on = true; p.name = nm; }
    await hostPublish();
    const o = privFor(pid);
    if (o) MQC.pub(`${BASE}/p/${pid}`, await C.enc(HOST.keys[pid], o), true);
    return;
  }
  if (m.p && m.c && HOST.keys[m.p]) {
    const a = await C.dec(HOST.keys[m.p], unb64u(m.c));
    if (!a) return;
    HOST.seen[m.p] = Date.now();
    const p = player(m.p);
    if (p && !p.on) { p.on = true; await hostPublish(); }
    if (a.t !== 'ping') await hostAct(m.p, a);
  }
}

async function act(a){
  if (isHost()) return hostAct(S.hostId, a);
  return clientAct(a);
}

async function hostAct(pid, a){
  const p = player(pid), H = HOST.H;
  if (!p) return;
  if (a.t === 'ready' && S.phase === 'reveal' && p.inRound) {
    p.ready = true;
    if (inRound().every(x => x.ready || !x.on)) { S.phase = 'questions'; S.turn = 0; }
    return hostPublish();
  }
  if (a.t === 'next' && S.phase === 'questions' && a.turn === S.turn) {
    const [asker] = pairAt(S.turn);
    if (pid !== asker && pid !== S.hostId) return;
    S.turn++;
    if (S.turn >= totalTurns()) { S.phase = 'vote'; H.votes = {}; }
    return hostPublish();
  }
  if (a.t === 'vote' && S.phase === 'vote' && p.inRound && !p.voted) {
    const tgt = player(a.target);
    if (!tgt || !tgt.inRound || tgt.id === pid) return;
    H.votes[pid] = tgt.id; p.voted = true;
    if (inRound().every(x => x.voted || !x.on)) return hostReveal();
    return hostPublish();
  }
  if (a.t === 'guess' && S.phase === 'guess' && pid === H.spyId) {
    if (!H.options.includes(a.word)) return;
    return hostFinish(a.word);
  }
}

function hostBind(on){
  on('start', hostStart);
  on('forceQ', () => { S.phase = 'questions'; S.turn = 0; hostPublish(); });
  on('toVote', () => { S.phase = 'vote'; HOST.H.votes = {}; hostPublish(); });
  on('reveal', hostReveal);
  on('skipGuess', () => hostFinish(null));
  on('newRound', hostStart);
  on('endRoom', async () => {
    const b = $('endRoom');
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'متأكد؟ اضغط مرة ثانية'; return; }
    S.phase = 'closed'; await hostPublish();
    for (const pl of S.players) MQC.pub(`${BASE}/p/${pl.id}`, new Uint8Array(0), true);
    setTimeout(() => { MQC.pub(BASE + '/s', new Uint8Array(0), true); LS.del(HKEY); setTimeout(() => location.reload(), 400); }, 1500);
  });
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { S.settings.cat = b.dataset.cat; hostPublish(); });
  document.querySelectorAll('[data-laps]').forEach(b => b.onclick = () => { S.settings.laps = +b.dataset.laps; hostPublish(); });
  on('spyCat', () => { S.settings.spyKnowsCat = !S.settings.spyKnowsCat; hostPublish(); });
}

async function hostStart(){
  const H = HOST.H;
  const live = S.players.filter(p => p.on);
  if (live.length < 3) { toast('تحتاجون ٣ لاعبين متصلين على الأقل'); return; }
  const catId = S.settings.cat === 'random' ? pick(Object.keys(BANK)) : S.settings.cat;
  const cat = BANK[catId];
  let pool = cat.words.filter(w => !H.used.includes(w));
  if (!pool.length) { H.used = H.used.filter(w => !cat.words.includes(w)); pool = cat.words.slice(); }
  H.topic = pick(pool); H.used.push(H.topic);
  H.catName = cat.name;
  H.options = shuffle([H.topic, ...shuffle(cat.words.filter(w => w !== H.topic)).slice(0, 11)]);
  H.spyId = pick(live).id;
  H.votes = {};
  S.round++;
  S.players.forEach(p => { p.inRound = p.on; p.ready = false; p.voted = false; });
  S.order = shuffle(live.map(p => p.id));
  S.turn = 0; S.result = null; S.phase = 'reveal';
  UI = {peek:false, vote:null, guess:null};
  await hostSendPrivates();
  await hostPublish();
}

async function hostReveal(){
  const H = HOST.H;
  const tally = {};
  Object.values(H.votes).forEach(t => tally[t] = (tally[t] || 0) + 1);
  const max = Math.max(0, ...Object.values(tally));
  const top = Object.keys(tally).filter(k => tally[k] === max);
  const caught = max > 0 && top.length === 1 && top[0] === H.spyId;
  const delta = {};
  for (const [v, t] of Object.entries(H.votes)) if (t === H.spyId) delta[v] = (delta[v] || 0) + 100;
  if (!caught) delta[H.spyId] = (delta[H.spyId] || 0) + 100;
  S.result = {spyId:H.spyId, votes:H.votes, tally, caught, delta, topic:null, guess:null, guessOk:false};
  S.phase = 'guess';
  await hostSendPrivates();
  await hostPublish();
  const spy = player(H.spyId);
  if (!spy || !spy.on) toast('الجاسوس غير متصل، تقدر تتخطى تخمينه');
}

async function hostFinish(word){
  const H = HOST.H, R = S.result;
  R.guess = word; R.guessOk = word === H.topic; R.topic = H.topic;
  if (R.guessOk) R.delta[H.spyId] = (R.delta[H.spyId] || 0) + 150;
  for (const [id, v] of Object.entries(R.delta)) { const p = player(id); if (p) p.score += v; }
  S.phase = 'result';
  await hostSendPrivates();
  await hostPublish();
}

/* ======================================================================
   اللاعب: يدخل من الرابط بدون كود
   ====================================================================== */
let CL = null; // {room, b, pid, name, priv, pub, privKey, shared}

async function clientBoot(){
  const [room, k, b] = location.hash.slice(1).split('.');
  if (!room || !k || !BROKERS[+b]) {
    $('app').innerHTML = `<div class="hero"><h2>الرابط ناقص</h2><p>اطلب من المؤسس يرسل لك رابط الغرفة كامل.</p></div>`;
    setNet('down'); return;
  }
  try { KEY = await C.aes(unb64u(k)); } catch(e){ $('app').innerHTML = `<div class="hero"><h2>الرابط غلط</h2><p>اطلب رابط جديد من المؤسس.</p></div>`; return; }
  BASE = `r3d-spy/v1/${room}`;
  const ck = 'r3d.spy.c.' + room;
  CL = LS.get(ck, null);
  if (!CL) {
    const kp = await C.pair();
    CL = {room, pid: 'p' + rid(7), name: '', priv: await C.exp(kp.privateKey), pub: await C.exp(kp.publicKey)};
    LS.set(ck, CL);
  }
  CL.key = ck;
  ME = {id: CL.pid, name: CL.name || ''};
  CL.privKey = await C.impPriv(CL.priv);
  skeleton();
  MQC = new MQ(BROKERS[+b], clientOnMsg, s => { setNet(s); if (s === 'up' && CL.name) sendJoin(); });
  MQC.sub(BASE + '/s');
  MQC.sub(`${BASE}/p/${CL.pid}`);
  setTimeout(() => { if (!S) { $('app').innerHTML = `<div class="hero"><h2>ما لقيت الغرفة</h2><p>يمكن المؤسس قفلها أو جواله مو متصل. تأكد من الرابط وجرّب بعد شوي.</p></div>`; } }, 12000);
  setInterval(() => { if (CL.name && CL.shared) clientAct({t:'ping'}); }, 8000);
  setInterval(() => { if (S) render(); }, 10000);
}

function clientNameScreen(){
  $('app').innerHTML = `<div class="hero"><h2>انضم للغرفة</h2><p>اكتب اسمك وادخل، ما تحتاج كود.</p></div>
    <div class="card"><div class="field"><label class="label" for="cname">اسمك في اللعبة</label><input id="cname" maxlength="16" autocomplete="off" placeholder="مثلاً: سلمان"></div></div>
    ${playersCard(false)}`;
  $('footIn').innerHTML = `<button class="btn" id="joinBtn" type="button">ادخل</button>`;
  $('foot').hidden = false;
  const go = () => {
    const n = $('cname').value.trim();
    if (!n) { $('cname').focus(); toast('اكتب اسمك أول'); return; }
    CL.name = n.slice(0, 16);
    const {privKey, shared, key, ...save} = CL; LS.set(CL.key, save);
    ME = {id: CL.pid, name: CL.name};
    sendJoin();
    skeleton();
  };
  $('joinBtn').onclick = go;
  $('cname').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('cname').focus();
}

async function sendJoin(){ MQC.pub(BASE + '/i', await C.enc(KEY, {join:{pid:CL.pid, name:CL.name, pub:CL.pub}}), false); }

let pendingPriv = null;
async function clientOnMsg(topic, bytes){
  if (topic === BASE + '/s') {
    if (!bytes.length) { if (S) { S.phase = 'closed'; render(); } return; }
    const st = await C.dec(KEY, bytes);
    if (!st) return;
    const firstState = !S;
    const phaseChanged = S && S.phase !== st.phase;
    const roundChanged = S && S.round !== st.round;
    if (!CL.shared || !S || JSON.stringify(S.hostPub) !== JSON.stringify(st.hostPub)) CL.shared = await C.shared(CL.privKey, st.hostPub);
    S = st;
    if (roundChanged) UI = {peek:false, vote:null, guess:null};
    if (phaseChanged && st.phase === 'vote') UI.vote = null;
    if (pendingPriv) { const b = pendingPriv; pendingPriv = null; await clientPriv(b); }
    if (!CL.name) { if (firstState) clientNameScreen(); else if ($('cname')) { const v = $('cname').value; clientNameScreen(); $('cname').value = v; } return; }
    ME = {id: CL.pid, name: CL.name};
    if (!player(CL.pid)) { if (firstState) sendJoin(); skeleton(); return; }
    render();
    return;
  }
  if (topic === `${BASE}/p/${CL.pid}`) {
    if (!bytes.length) return;
    if (!CL.shared) { pendingPriv = bytes; return; }
    await clientPriv(bytes);
    if (S && CL.name && player(CL.pid)) render();
  }
}
async function clientPriv(bytes){ const o = await C.dec(CL.shared, bytes); if (o) PRIV = o; }

async function clientAct(a){
  if (!CL.shared) return;
  const inner = await C.enc(CL.shared, a);
  MQC.pub(BASE + '/i', await C.enc(KEY, {p:CL.pid, c:b64u(inner)}), false);
  if (a.t === 'ready' || a.t === 'vote' || a.t === 'guess' || a.t === 'next') {
    const p = player(CL.pid);
    if (p && a.t === 'ready') p.ready = true;
    if (p && a.t === 'vote') p.voted = true;
    render();
  }
}

/* ---------- تشغيل ---------- */
if (MODE === 'host' && window.parent !== window) { const b = $('toLib'); b.hidden = false; b.onclick = () => parent.postMessage('r3d:back', location.origin); }
if (MODE === 'host') hostBoot(); else clientBoot();
</script>
