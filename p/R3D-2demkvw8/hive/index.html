/* نفس هوية المنصة: أرضية سودا، ضوء منقّط بلون اللعبة فوق، زوايا كاميرا، وأقسام بخطوط رفيعة بدل الكروت.
   كل لعبة تحدد لونها في --g (الجاسوس بنفسجي، الميمز أصفر). */
:root{
  --bg:#000; --bg2:#ffffff08; --panel:#0b0b0b; --panel2:#ffffff12; --line:#ffffff1f; --line2:#ffffff3a;
  --fg:#fff3ec; --mute:#a89e9a; --dim:#716865;
  --acc:#ff2a3a; --g:#b07cff; --g-bg:#b07cff1f; --g-fg:#140a24; --glow:#6d3bd433; --ok:#62e6ad; --warn:#ffb020; --bad:#ff6b6b;
  --ar:'Lifta','Anton',system-ui,sans-serif; --lat:'Anton','Lifta',Impact,sans-serif; --num:'Bebas Neue','Anton','Lifta',sans-serif;
  --out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(760px 420px at 50% -12%,var(--glow),transparent 70%) no-repeat,var(--bg);color:var(--fg);font-family:var(--ar);font-size:18px;line-height:1.7;font-synthesis:none;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;isolation:isolate}
/* الضوء المنقّط فوق، وزوايا الكاميرا */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle,var(--g) 0 .9px,transparent 1.35px) 0 0/5px 5px;-webkit-mask:radial-gradient(95vmax 46vmax at 50% -6%,#000b,transparent 72%);mask:radial-gradient(95vmax 46vmax at 50% -6%,#000b,transparent 72%);opacity:.6}
body::after{content:"";position:fixed;z-index:60;pointer-events:none;top:max(8px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));--c:#ffffff4a;background:linear-gradient(var(--c),var(--c)) 0 0/16px 1.5px,linear-gradient(var(--c),var(--c)) 0 0/1.5px 16px,linear-gradient(var(--c),var(--c)) 100% 0/16px 1.5px,linear-gradient(var(--c),var(--c)) 100% 0/1.5px 16px,linear-gradient(var(--c),var(--c)) 0 100%/16px 1.5px,linear-gradient(var(--c),var(--c)) 0 100%/1.5px 16px,linear-gradient(var(--c),var(--c)) 100% 100%/16px 1.5px,linear-gradient(var(--c),var(--c)) 100% 100%/1.5px 16px;background-repeat:no-repeat}
h1,h2,h3,b,strong,button{font-weight:400}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:4px}
::selection{background:var(--g);color:var(--g-fg)}
.num{font-family:var(--num);direction:ltr;unicode-bidi:isolate;letter-spacing:.04em}
.lat{font-family:var(--lat);direction:ltr;unicode-bidi:isolate}

.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px max(20px,env(safe-area-inset-right,0px)) 18px max(20px,env(safe-area-inset-left,0px));padding-top:max(16px,env(safe-area-inset-top,0px));background:linear-gradient(#000 0,#000000e6 55%,#0000)}
.bar h1{margin:0;font-size:27px;line-height:1}
.bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:2px 0;font-size:15px;color:var(--mute);white-space:nowrap}
.chip .num{font-size:20px;color:var(--fg)}
button.chip{color:var(--fg);border-bottom:1px solid var(--line2);transition:border-color .2s}
button.chip:hover{border-color:var(--fg)}
#toLib{min-height:44px;padding:8px 18px;border:1px solid var(--line2);border-radius:999px;font-size:16px}
@media (pointer:coarse), (max-width:600px){#toLib{min-height:46px;font-size:17px}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.mid{background:var(--warn);animation:blink 1.2s steps(1) infinite}
.dot.off{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}

main{max-width:560px;margin:0 auto;padding:10px max(20px,env(safe-area-inset-right,0px)) 190px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:26px}
.card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0 0;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:26px;line-height:1.3}
.card .sub{margin:0;color:var(--mute);font-size:16px}
.label{font-size:15px;color:var(--dim)}
.hero{text-align:start;padding:14px 0 2px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hero h2{margin:0;font-size:clamp(40px,11.5vw,58px);line-height:1.08;text-wrap:balance}
.hero p{margin:0;color:var(--mute);font-size:17px;max-width:34ch}

.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:56px;padding:10px 26px;border-radius:999px;background:var(--fg);color:#000;font-size:19px;transition:background .2s,transform .15s,opacity .2s}
.btn:not(.ghost):not(.sm):not(.red)::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--g);flex:none;transition:transform .35s var(--out)}
.btn:hover{background:#fff}
.btn:hover::before{transform:scale(1.5)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.red{background:var(--acc);color:#fff}
.btn.ghost{background:none;box-shadow:inset 0 0 0 1px var(--line2);color:var(--fg)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--fg)}
.btn.sm{width:auto;min-height:40px;padding:4px 18px;font-size:16px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.helper{font-size:15px;color:var(--dim);text-align:center}

.field{display:flex;flex-direction:column;gap:4px}
.field input{width:100%;padding:8px 2px 10px;border:0;border-bottom:2px solid var(--line2);border-radius:0;background:none;color:var(--fg);font-size:26px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--g)}
.field input::placeholder{color:var(--dim)}

.linkbox{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:0;background:var(--bg2);border:1px dashed var(--line2)}
.linkbox code{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--mute);direction:ltr;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* لاعبين */
.plist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 2px;border-radius:0;background:none;border:0;border-bottom:1px solid var(--line)}
.pl.me{box-shadow:inset -2px 0 0 var(--g);padding-right:12px}
.pl.away{opacity:.5}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none;color:#0b0b0e;overflow:hidden;line-height:1}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:13px;padding:0 9px;border-radius:999px;background:none;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.badge.host{color:var(--warn);border-color:#ffb02066}
.badge.ok{color:var(--ok);border-color:#62e6ad66}
.pl .pts{font-family:var(--num);font-size:22px;direction:ltr;min-width:36px;text-align:left}

/* إعدادات */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:4px 14px;border-radius:999px;border:1px solid var(--line2);background:none;font-size:15px;color:var(--mute);transition:color .2s,border-color .2s,background .2s}
.chips button:hover{color:var(--fg);border-color:var(--fg)}
.chips button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#000}
.seg{display:inline-flex;gap:20px;padding:0;border-radius:0;background:none;border:0}
.seg button{position:relative;padding:4px 2px;border-radius:0;color:var(--mute);font-size:18px;transition:color .2s}
.seg button::after{content:"";position:absolute;right:0;left:0;bottom:0;height:2px;background:var(--g);transform:scaleX(0);transition:transform .4s var(--out)}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg button[aria-pressed="true"]::after{transform:scaleX(1)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line2);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .25s var(--out)}
.switch[aria-checked="true"]{background:var(--g)}
.switch[aria-checked="true"]::after{transform:translateX(-20px)}
.prog{height:3px;border-radius:0;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--g);border-radius:0;transition:width .3s}
.plus{color:var(--ok);font-family:var(--num);font-size:20px;direction:ltr}
/* سكلتون وتوست وتنبيه */
.sk{border-radius:0;background:linear-gradient(90deg,#ffffff06 0,#ffffff14 40%,#ffffff06 80%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.banner{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:0;background:#ffb02012;border:1px solid #ffb02044;color:#ffd58a;font-size:15px}
.banner.bad{background:#ff6b6b12;border-color:#ff6b6b44;color:#ffb3bd}
.toasts{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--fg);color:#000;padding:8px 20px;border-radius:999px;font-size:16px;animation:tin .3s var(--out)}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.foot{position:fixed;inset:auto 0 0 0;z-index:6;padding:30px max(20px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:linear-gradient(#0000,#000 42%)}
.foot .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* الطرد والقفل: تضغط على لاعب وتطلع نافذة من تحت */
.pl[data-mod]{cursor:pointer;transition:background .15s}
.pl[data-mod]:hover{background:#ffffff08}
.pl .more{color:var(--dim);font-size:20px;line-height:1;letter-spacing:-1px}
.badge.kick{color:#ffb3bd;border-color:#ff6b6b66}
.lockbtn[aria-pressed="true"],.chip.locked{border-color:#ff6b6b66;color:#ffb3bd}
.ptools{display:flex;align-items:center;gap:8px}
.msheet-bg{position:fixed;inset:0;z-index:40;background:#000000c7;display:flex;align-items:flex-end;justify-content:center;animation:mfade .2s}
.msheet{width:100%;max-width:560px;background:#000;border:0;border-top:1px solid var(--line2);border-radius:0;padding:12px max(20px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;animation:mup .35s var(--out)}
.msheet .grab{width:42px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 4px}
.msheet .mwho{display:flex;align-items:center;gap:10px;font-size:24px}
.msheet .mwho .label{margin-inline-start:auto}
@keyframes mup{from{transform:translateY(40px);opacity:0}}
@keyframes mfade{from{opacity:0}}

/* بوتات التجربة (للمالك بس) */
#botBtn{position:fixed;z-index:30;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 84px);min-height:44px;padding:6px 16px;border-radius:999px;background:#0b0b0bee;border:1px solid #ffffff3a;color:#fff3ec;font-family:var(--ar);font-size:16px;display:flex;align-items:center;gap:6px}
#botBtn .num{font-size:19px}
#botDock{position:fixed;z-index:72;left:-10000px;top:0;width:400px;height:800px;pointer-events:none}
.botfr{position:absolute;inset:0;width:400px;height:800px;border:0;background:#000}
.botfr.on{position:fixed;z-index:72;inset:auto;left:50%;top:110px;transform:translateX(-50%);width:min(420px,calc(100vw - 20px));height:calc(100% - 122px);border-radius:22px;box-shadow:0 0 0 1px #ffffff3a,0 20px 60px #000;pointer-events:auto}
#botView{position:fixed;inset:0;z-index:71;background:#000000eb;font-family:var(--ar);color:#fff3ec}
#botView .bvbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:max(14px,env(safe-area-inset-top,0px)) 16px 6px}
#botView .sp{flex:1}
#botView .chip{color:#fff3ec;min-height:40px;font-size:16px;border-bottom:1px solid #ffffff3a}
#botView [data-v="auto"][aria-pressed="false"]{color:#ffb020}
#botView .bvname{text-align:center;font-size:20px;line-height:1.4}
.botsheet .botrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.botsheet .botrow .nm{flex:1}

/* شريط انقطاع الاتصال (فوق كل شي، بنفس الشكل في كل الثيمات) */
.netbanner{position:fixed;z-index:70;top:max(10px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:#ffb020;color:#1a1000;font-family:var(--ar);font-size:16px;line-height:1.3;white-space:nowrap;max-width:calc(100vw - 24px);box-shadow:0 6px 24px #0007;animation:nbin .35s var(--out)}
.netbanner .spin{width:14px;height:14px;flex:none;border-radius:50%;border:2.5px solid #1a100055;border-top-color:#1a1000;animation:nbspin .8s linear infinite}
@keyframes nbin{from{opacity:0;transform:translate(-50%,-12px)}}
@keyframes nbspin{to{transform:rotate(1turn)}}

/* «كيف تلعب؟» في اللوبي: مفتوح أول مرة، وبعدها سطر صغير ينفتح بالضغط */
.how{border-top:1px solid var(--line);padding-top:12px}
.how summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:19px;min-height:40px}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"";width:8px;height:8px;border:solid currentColor;border-width:0 0 2px 2px;transform:rotate(-45deg);margin-inline-start:auto;transition:transform .2s;opacity:.7}
.how[open] summary::after{transform:rotate(135deg)}
.how ol{margin:6px 0 4px;padding:0;list-style:none;counter-reset:how;display:flex;flex-direction:column;gap:10px}
.how li{counter-increment:how;display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.6}
.how li::before{content:counter(how);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:var(--g-fg);font-family:var(--num);font-size:17px;line-height:1}

/* الكمبيوتر: عمودين (setApp في core.js يحط main.split). اللعب يمين، والكروت الجانبية يسار وتثبت وأنت تنزل */
@media (min-width:1024px){
  main.split{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) 380px;column-gap:56px;align-items:start}
  main.split>.col-main,main.split>.col-side{display:flex;flex-direction:column;row-gap:inherit;min-width:0}
  main.split>.col-main{width:100%;max-width:640px;justify-self:center}
  main.split>.col-side{position:sticky;top:96px;max-height:calc(100vh - 120px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-bottom:24px}
  body.split .foot .in{max-width:min(560px,calc(100vw - 520px));transform:translateX(218px)}
  body.wide .toasts{bottom:auto;top:max(84px,env(safe-area-inset-top,0px))}
  main.split .memebox{width:100%;max-width:min(100%,50vh);margin-inline:auto}
  /* اللوبي: العنوان فوق بالعرض، والكروت أعمدة تحته */
  main.spread{max-width:1180px}
  main.spread>.col-main{display:flex;flex-direction:column;row-gap:inherit}
  main.spread>.col-side{column-count:2;column-gap:48px}
  main.spread>.col-side>*{break-inside:avoid;margin-bottom:28px}
}
@media (min-width:1360px){main.spread>.col-side{column-count:3}}

/* خلية الحروف: ثيم خاص فيها (مو ثيم المنصة). ألوانه وأفكاره تحت في «ثيم اللعبة». الأخضر يوصّل يمين ↔ يسار، والبرتقالي فوق ↔ تحت. فيه فاتح وداكن. */
html[data-theme=light] body::after{--c:#0000003d}
html[data-theme=light] .bar{background:linear-gradient(var(--bg) 0,color-mix(in srgb,var(--bg) 90%,transparent) 55%,transparent)}
html[data-theme=light] .foot{background:linear-gradient(transparent,var(--bg) 42%)}
html[data-theme=light] .btn{color:var(--bg)}
html[data-theme=light] .btn:hover{background:#000}
html[data-theme=light] .btn.ghost{color:var(--fg)}
html[data-theme=light] .btn.red{color:#fff}
html[data-theme=light] .toast,html[data-theme=light] .chips button[aria-pressed="true"]{color:var(--bg)}
html[data-theme=light] .msheet{background:var(--bg)}
html[data-theme=light] .msheet-bg{background:#0000005c}
html[data-theme=light] .sk{background:linear-gradient(90deg,#00000006 0,#00000012 40%,#00000006 80%);background-size:200% 100%}
html[data-theme=light] .banner{color:#7a4b00}
html[data-theme=light] .banner.bad{color:#9a1c2b}
html,body,.bar,.foot,.msheet{transition:background-color .35s}

.tbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line2);color:var(--fg)}
.tbtn svg{width:19px;height:19px}

/* اللوحة */
.board{display:block;width:min(100%,440px);height:auto;margin:0 auto;overflow:visible;user-select:none;-webkit-user-select:none}
.board .hx{fill:var(--cell);stroke:var(--cellS);stroke-width:1.2;stroke-linejoin:round;transition:fill .35s,stroke .35s}
.board .lt{font-family:'Lifta',sans-serif;fill:var(--cellT);text-anchor:middle;dominant-baseline:central;pointer-events:none;transition:fill .35s}
.board .lt.m{dominant-baseline:alphabetic}
.board .A .hx{fill:var(--A);stroke:var(--A)}
.board .B .hx{fill:var(--B);stroke:var(--B)}
.board .A .lt,.board .B .lt,.board .sel .lt{fill:var(--hiT)}
.board .sel .hx{fill:var(--gold);stroke:var(--gold);animation:selp 1.1s ease-in-out infinite}
@keyframes selp{50%{stroke-width:6}}
.board .can{cursor:pointer}
.board .can:hover .hx{stroke:var(--fg);stroke-width:2.4}
.board .path .hx{filter:drop-shadow(0 0 7px var(--wc))}
.board .dim .hx{opacity:.35}
.board .eA{stroke:var(--A);stroke-width:13;stroke-linecap:round;fill:none}
.board .eB{stroke:var(--B);stroke-width:13;stroke-linecap:round;fill:none}
.board .pop{animation:pop .5s var(--out)}
@keyframes pop{from{transform:scale(.6);opacity:.2}}
.board g.cell{transform-box:fill-box;transform-origin:center}

.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.turn{display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;text-align:center}
.turn .bl{font-size:44px;line-height:1;color:var(--gold)}
.tdot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}
.score{display:flex;justify-content:center;gap:10px}
.score span{display:inline-flex;align-items:center;gap:8px;padding:3px 14px;border-radius:99px;border:1px solid var(--line2);font-size:17px}
.score .num{font-size:22px}

/* الفرق */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{display:flex;flex-direction:column;gap:4px;padding:10px 10px 12px;border:1px solid var(--line)}
.team.A{border-top:3px solid var(--A)}
.team.B{border-top:3px solid var(--B)}
.team h3{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:8px}
.team .tp{display:flex;align-items:center;gap:8px;font-size:16px;min-height:34px;padding:2px 0}
.team .tp .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .tp.me .nm{color:var(--g)}
.team .tp.away{opacity:.5}
.team .tp[data-ps]{cursor:pointer}
.team .emp{font-size:14px;color:var(--dim)}
.team .btn{min-height:42px;font-size:16px;margin-top:6px}
.hostrow{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:58px;border:1px dashed #ffd76a77;background:#ffd76a0d;font-size:16px}
.hostrow .k{color:var(--gold);font-size:14px;white-space:nowrap}
.hostrow{flex-wrap:wrap;row-gap:8px}
.hostrow .nm{flex:1 0 auto;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hostrow .btn{flex:none;min-height:38px;padding:4px 14px;font-size:15px;white-space:nowrap;margin-inline-start:auto}
.free{display:flex;flex-wrap:wrap;gap:6px}
.free span{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;border:1px solid var(--line);border-radius:99px;font-size:14px;cursor:pointer}

/* السؤال للهوست */
.q{border:1px dashed #ffd76a88;background:#ffd76a10;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.q .k{font-size:13px;color:var(--gold)}
.q .t{margin:0;font-size:22px;line-height:1.5}
.q .a{font-size:16px;color:var(--mute)}
.q .a b{color:var(--fg);font-weight:400;font-size:20px}
.ans{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line2)}
.ans .who{display:flex;align-items:center;gap:8px;font-size:18px}
.ans .num{font-size:34px}
.ans.A{border-color:var(--A)} .ans.A .num{color:var(--A)}
.ans.B{border-color:var(--B)} .ans.B .num{color:var(--B)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.ok{background:var(--A);color:#03140c}
.btn.no{background:#ff5a5a;color:#fff}
.btn.ok::before,.btn.no::before{display:none}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn.sm2{min-height:44px;font-size:16px;padding:4px 8px}

/* الجرس */
.buzzwrap{display:grid;place-items:center;padding:8px 0 4px}
.buzz{position:relative;width:min(64vw,250px);aspect-ratio:1;border-radius:50%;border:0;font:inherit;font-size:40px;color:#03140c;cursor:pointer;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--tc) 55%,#fff),var(--tc) 55%,color-mix(in srgb,var(--tc) 70%,#000));
  box-shadow:0 0 0 10px color-mix(in srgb,var(--tc) 18%,transparent),0 0 0 24px color-mix(in srgb,var(--tc) 8%,transparent),0 24px 60px color-mix(in srgb,var(--tc) 45%,transparent);
  transition:transform .08s}
.buzz:active{transform:scale(.94)}
.buzz:disabled{filter:grayscale(1);opacity:.4;cursor:not-allowed}
.buzz::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--tc);opacity:0;animation:ring 1.6s ease-out infinite}
.buzz:disabled::after{animation:none}
@keyframes ring{from{transform:scale(.92);opacity:.7}to{transform:scale(1.25);opacity:0}}
.wait{text-align:center;font-size:18px;color:var(--mute)}
.bigl{font-size:64px;line-height:1;color:var(--gold);text-align:center}

/* أول ضغطة: تطلع للكل */
.flash{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 44%,color-mix(in srgb,var(--tc) 92%,transparent),var(--td) 64%,#000);color:#fff;animation:fl .45s var(--out)}
@keyframes fl{from{opacity:0;transform:scale(1.08)}}
.flash .burst{position:absolute;left:50%;top:44%;width:10px;height:10px;margin:-5px;border-radius:50%;box-shadow:0 0 0 0 #fff8;animation:burst 1s ease-out}
@keyframes burst{to{box-shadow:0 0 0 70vmax #fff0}}
.flash .big{width:126px;height:126px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:64px;box-shadow:0 0 0 8px #ffffff40,0 0 0 20px #ffffff17;animation:bigin .6s var(--out)}
@keyframes bigin{from{transform:scale(.3)}}
.flash .nm{font-size:clamp(40px,12vw,64px);line-height:1.1}
.flash .s{font-size:20px;opacity:.9}
.flash svg{width:92px;height:92px;margin-top:6px}
.flash svg circle{fill:none;stroke-width:7}
.flash .rt{font-family:var(--num);font-size:34px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.flash.mine .s.me{display:block}
.flash .s.me{display:none;font-size:24px;color:#fff}
.halt{position:fixed;inset:0;z-index:31;display:grid;padding:16px;place-items:center;text-align:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px)}
.halt h2{margin:0;font-size:clamp(30px,9vw,40px);line-height:1.2}
.halt .hico{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;border:2px solid var(--line2);margin-bottom:12px}
.halt .hico svg{width:34px;height:34px}
.ico{width:.9em;height:.9em;flex:none}
.halt p{margin:6px 0 0;color:var(--mute)}
.winbox{text-align:center;display:flex;flex-direction:column;gap:4px}
.winbox h2{margin:0;font-size:clamp(40px,11vw,58px);line-height:1.1}
.reveal{display:flex;justify-content:center;gap:8px;font-size:16px;color:var(--mute)}
.reveal b{color:var(--fg);font-weight:400}
.psheet .opt{min-height:50px}
/* طبقات الأفكتات: الثيم يقرر وش يبان منها */
.deco{display:none}
.logo{display:flex;flex-direction:column;align-items:flex-start}
.board .hd,.board .hg,.board .hw,.board .eg{display:none}
.board g.ci{transform-box:fill-box;transform-origin:center}
.turn b.tn{color:var(--tc);font-weight:400}
.winbox h2{color:var(--tc)}
.flash .rays,.flash .conf{display:none}
#party{position:fixed;inset:0;z-index:35;pointer-events:none;overflow:hidden}
#party:empty{display:none}

/* ====================== ثيم اللعبة ====================== */
/* ---------- مشترك بين الثيمات ---------- */
html[data-skin]{--hexP:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
html[data-skin] body::before,html[data-skin] body::after{content:none}
html[data-skin] body{background:var(--bg)}
html[data-skin] .deco{display:block;position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
html[data-skin] .deco i{position:absolute;display:block}
html[data-skin] .bar{background:linear-gradient(var(--bar) 0,color-mix(in srgb,var(--bar) 78%,transparent) 62%,transparent)}
html[data-skin] .foot{background:linear-gradient(transparent,var(--bar) 46%)}
html[data-skin] .btn:not(.ghost):not(.sm):not(.red)::before{display:none}
html[data-skin] .board .hd,html[data-skin] .board .hg,html[data-skin] .board .eg{display:block}
html[data-skin] .board .hx{fill:var(--tile);stroke:var(--tileS);stroke-width:var(--tileSW);stroke-linejoin:round}
html[data-skin] .board .hd{fill:var(--tileD);transform:translate(var(--dx),var(--dy))}
html[data-skin] .board .hg{fill:url(#hvGloss);opacity:var(--gloss);pointer-events:none}
html[data-skin] .board .lt{fill:var(--tileT)}
html[data-skin] .board .A .hx{fill:var(--A);stroke:var(--AS,var(--tileS))}
html[data-skin] .board .B .hx{fill:var(--B);stroke:var(--BS,var(--tileS))}
html[data-skin] .board .sel .hx{fill:var(--gold);stroke:var(--goldS,var(--tileS));animation:none}
html[data-skin] .board .A .hd{fill:var(--AD)}
html[data-skin] .board .B .hd{fill:var(--BD)}
html[data-skin] .board .sel .hd{fill:var(--goldD)}
html[data-skin] .board .A .lt{fill:var(--AT)}
html[data-skin] .board .B .lt{fill:var(--BT)}
html[data-skin] .board .sel .lt{fill:var(--goldT)}
html[data-skin] .board .ec .eA{stroke:var(--A);stroke-width:var(--eW)}
html[data-skin] .board .ec .eB{stroke:var(--B);stroke-width:var(--eW)}
html[data-skin] .board .path .hx{filter:none}
html[data-skin] .board .dim .hx{opacity:1}
html[data-skin] .board .dim{opacity:.3;transition:opacity .6s}
html[data-skin] .board .pop{animation:none}
html[data-skin] .board .ci{transition:transform .25s var(--out)}
html[data-skin] .board.enter .cell{animation:hvIn .7s var(--out) both;animation-delay:calc(var(--d) - var(--e))}
@keyframes hvIn{from{opacity:0;transform:scale(.15) rotate(-50deg)}}
html[data-skin] .board .pop .ci{animation:hvPop .8s var(--out)}
@keyframes hvPop{0%{transform:scale(.3)}35%{transform:scale(1.28,.82)}60%{transform:scale(.9,1.12)}100%{transform:none}}
html[data-skin] .board .hw{display:block;fill:none;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:hvWave .9s ease-out both;pointer-events:none}
html[data-skin] .board .A .hw{stroke:var(--A)}
html[data-skin] .board .B .hw{stroke:var(--B)}
@keyframes hvWave{from{transform:scale(.9);opacity:1}to{transform:scale(2);opacity:0}}
html[data-skin] .board .sel .ci{animation:hvSel 1.15s ease-in-out infinite}
@keyframes hvSel{50%{transform:scale(1.1)}}
html[data-skin] .board .path .ci{animation:hvWin .8s var(--out) both;animation-delay:calc(var(--p) * 110ms + 200ms)}
@keyframes hvWin{0%{transform:none}40%{transform:scale(1.24) translateY(-5px)}100%{transform:none}}
@media (hover:hover){html[data-skin] .board .can:hover .ci{transform:scale(1.08)}}
html[data-skin] .board .can:focus{outline:none}

<script>
const MODE = 'join';
const BANK = {};
const BROKERS = (() => { try { const o = JSON.parse(localStorage.getItem('r3d.spy.brokers')); if (Array.isArray(o) && o.length) return o; } catch(e){} return ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt']; })();
const te = new TextEncoder(), td = new TextDecoder();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR = n => String(n);
const rid = n => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (const b of crypto.getRandomValues(new Uint8Array(n))) s += a[b % a.length]; return s; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[crypto.getRandomValues(new Uint32Array(1))[0] % a.length];
const b64u = u => btoa(String.fromCharCode(...u)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const COLORS = ['#b07cff','#36d39a','#ffb020','#6aa8ff','#ff7aa8','#4fd1c5','#f6a35b','#c3e66b','#ff8f6b','#9aa7ff'];
const colorOf = id => COLORS[[...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % COLORS.length];
const avatar = p => `<span class="av" style="background:${colorOf(p.id)}">${esc([...p.name][0] || '؟')}</span>`;

/* ---------- عميل MQTT صغير على WebSocket (QoS 0) ---------- */
class MQ {
  constructor(url, onMsg, onState){ this.url = url; this.onMsg = onMsg; this.onState = onState; this.subs = new Set(); this.q = []; this.ok = false; this.buf = new Uint8Array(0); this.tries = 0; MQ.all.add(this); this.open(); }
  str(s){ const b = te.encode(s); return [b.length >> 8, b.length & 255, ...b]; }
  pkt(h, body){ const len = []; let n = body.length; do { let d = n % 128; n = Math.floor(n / 128); if (n) d |= 128; len.push(d); } while (n); return new Uint8Array([h, ...len, ...body]); }
  open(){
    this.onState('connecting');
    let ws;
    try { ws = new WebSocket(this.url, ['mqtt']); } catch(e){ return this.retry(); }
    ws.binaryType = 'arraybuffer';
    this.ws = ws;
    ws.onopen = () => ws.send(this.pkt(0x10, [...this.str('MQTT'), 4, 2, 0, 45, ...this.str('r3d' + rid(10))]));
    ws.onmessage = e => { if (this.ws === ws) { this.rx = Date.now(); this.feed(new Uint8Array(e.data)); } };
    ws.onclose = () => { if (this.ws !== ws) return; this.ok = false; clearInterval(this.ping); this.onState('down'); this.retry(); };
    ws.onerror = () => {};
  }
  retry(){ if (this.closed) return; this.tries++; clearTimeout(this.rt); this.rt = setTimeout(() => this.open(), Math.min(8000, 600 * this.tries)); }
  // الجوال يقفل الاتصال بصمت لما تطلع من المتصفح: أول ما ترجع أو يرجع النت نعيد الاتصال على طول بدل ما ننتظر
  kick(force){
    if (this.closed) return;
    if (this.ok && !force) {
      // متصل بالاسم: نرسل نبضة، وإذا ما رد خلال ٣ ثواني نعيد الاتصال
      const t = Date.now();
      try { this.ws.send(new Uint8Array([0xC0, 0])); } catch(e){}
      clearTimeout(this.probe); this.probe = setTimeout(() => { if ((this.rx || 0) < t) this.kick(true); }, 3000);
      return;
    }
    clearTimeout(this.rt); clearTimeout(this.probe); clearInterval(this.ping); this.ok = false; this.tries = 0; this.buf = new Uint8Array(0);
    const old = this.ws; this.ws = null; try { old && old.close(); } catch(e){}
    this.open();
  }
  feed(chunk){
    const b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length); this.buf = b;
    for (;;) {
      if (this.buf.length < 2) return;
      let mul = 1, len = 0, i = 1, d;
      do { if (i >= this.buf.length) return; d = this.buf[i++]; len += (d & 127) * mul; mul *= 128; } while (d & 128);
      if (this.buf.length < i + len) return;
      const h = this.buf[0], body = this.buf.slice(i, i + len);
      this.buf = this.buf.slice(i + len);
      const type = h >> 4;
      if (type === 2) {
        if (body[1] !== 0) { this.onState('down'); continue; }
        this.ok = true; this.tries = 0; this.onState('up');
        for (const t of this.subs) this.sendSub(t);
        const q = this.q; this.q = []; q.forEach(p => this.ws.send(p));
        clearInterval(this.ping); this.ping = setInterval(() => { if (!this.ok) return; if (Date.now() - (this.rx || 0) > 60000) return this.kick(true); this.ws.send(new Uint8Array([0xC0, 0])); }, 25000);
      } else if (type === 3) {
        const tl = (body[0] << 8) | body[1];
        const topic = td.decode(body.slice(2, 2 + tl));
        const qos = (h >> 1) & 3;
        this.onMsg(topic, body.slice(2 + tl + (qos ? 2 : 0)));
      }
    }
  }
  sendSub(t){ this.ws.send(this.pkt(0x82, [0, 1 + (this.subs.size % 60000), ...this.str(t), 0])); }
  sub(t){ this.subs.add(t); if (this.ok) this.sendSub(t); }
  pub(t, payload, retain){
    const p = this.pkt(0x30 | (retain ? 1 : 0), [...this.str(t), ...payload]);
    if (this.ok) this.ws.send(p); else this.q.push(p);
  }
  close(){ this.closed = true; MQ.all.delete(this); clearTimeout(this.rt); try { this.ws.send(new Uint8Array([0xE0, 0])); this.ws.close(); } catch(e){} }
}

MQ.all = new Set();
const mqKick = () => MQ.all.forEach(m => m.kick());
addEventListener('online', mqKick);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') mqKick(); });
addEventListener('pageshow', e => { if (e.persisted) mqKick(); });

/* ---------- التشفير ---------- */
const C = {
  async aes(raw){ return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']); },
  async enc(key, obj){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj))));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
  },
  async dec(key, bytes){
    try { return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes.slice(0, 12)}, key, bytes.slice(12)))); }
    catch(e){ return null; }
  },
  async pair(){ return crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveKey']); },
  async exp(k){ return crypto.subtle.exportKey('jwk', k); },
  async impPriv(j){ return crypto.subtle.importKey('jwk', j, {name:'ECDH', namedCurve:'P-256'}, true, ['deriveKey']); },
  async impPub(j){ return crypto.subtle.importKey('jwk', j, {name:'ECDH', namedCurve:'P-256'}, true, []); },
  async shared(priv, pubJwk){ return crypto.subtle.deriveKey({name:'ECDH', public: await C.impPub(pubJwk)}, priv, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']); }
};

function toast(t){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
  $('toasts').appendChild(el); setTimeout(() => el.remove(), 2200);
}
// شريط فوق يطلع إذا انقطع الاتصال بعد ما كان شغّال، ويختفي أول ما يرجع
let netWasUp = false, netT = 0;
function netBanner(on){
  let b = $('netBanner');
  if (on && !b) {
    b = document.createElement('div'); b.id = 'netBanner'; b.className = 'netbanner'; b.setAttribute('role', 'status');
    b.innerHTML = '<span class="spin" aria-hidden="true"></span><span>انقطع الاتصال، نحاول نرجعك…</span>';
    document.body.appendChild(b);
  } else if (!on && b) b.remove();
}
function setNet(s){
  if (s === 'up') { clearTimeout(netT); if ($('netBanner')) { netBanner(false); toast('رجع الاتصال ✓'); } netWasUp = true; }
  else if (s === 'down' && netWasUp && !netT) netT = setTimeout(() => { netT = 0; if (NET !== 'up') netBanner(true); }, 1500);
  NET = s;
  const d = $('netDot'), t = $('netTxt');
  d.className = 'dot ' + (s === 'up' ? 'on' : s === 'down' ? 'off' : 'mid');
  t.textContent = s === 'up' ? 'متصل' : s === 'down' ? 'انقطع' : 'يتصل…';
}
async function copy(t){ try { await navigator.clipboard.writeText(t); toast('تم النسخ'); } catch(e){ toast('ما قدرت أنسخ، انسخه يدوي'); } }
function joinBase(dir){
  let base;
  try { base = parent.location.href.split('#')[0]; } catch(e){ base = location.href.split('#')[0]; }
  if (base.startsWith('blob:') || base.startsWith('about:')) base = location.origin + '/';
  return new URL(dir, base.endsWith('/') ? base : base.replace(/[^/]*$/, '')).href;
}

/* ---------- الكمبيوتر: عمودين ----------
   كل لعبة ترسم بـ setApp(h). على شاشة عريضة الكروت الجانبية (اللاعبين، الرابط، الإعدادات، كيف تلعب) تروح عمود يسار
   واللعب يبقى يمين. التوزيع يصير قبل ما ينحط بالصفحة، فالتركيز في خانة الكتابة ما يضيع. الجوال ما يتغيّر فيه شي. */
const WIDE = matchMedia('(min-width:1024px)');
// .card.stay يبقى مع اللعب. لو اللعب ما فيه إلا العنوان (اللوبي) العنوان ياخذ العرض كله والكروت تتوزع تحته أعمدة
const isSide = el => (el.matches('.card') && !el.matches('.compose,.stay')) || el.matches('details.how');
const isHead = el => el.matches('.hero,.banner');
function setApp(h){
  const app = $('app'), t = document.createElement('template'); t.innerHTML = h;
  const kids = [...t.content.children], side = kids.filter(isSide), rest = kids.filter(k => !isSide(k));
  const mode = !WIDE.matches || !side.length || !rest.length ? '' : rest.every(isHead) ? (side.length > 1 ? 'spread' : '') : 'split';
  app.classList.toggle('split', mode === 'split'); app.classList.toggle('spread', mode === 'spread');
  document.body.classList.toggle('split', mode === 'split'); document.body.classList.toggle('wide', !!mode);
  if (!mode) { app.innerHTML = h; return; }
  const a = document.createElement('div'), s = document.createElement('aside');
  a.className = 'col-main'; s.className = 'col-side';
  for (const k of kids) (isSide(k) ? s : a).appendChild(k);
  app.replaceChildren(a, s);
}
WIDE.addEventListener('change', () => { if (typeof S !== 'undefined' && S && typeof render === 'function') render(); });

/* ---------- «كيف تلعب؟» ----------
   كل لعبة تعرّف HOW = {k:'اسم', s:[ثلاث خطوات]} وتحط howCard() في اللوبي.
   ينفتح أول مرة، ولما يقفله اللاعب ينحفظ وما ينفتح لحاله مرة ثانية. */
function howCard(){
  if (typeof HOW === 'undefined' || BOT) return '';
  const open = !LS.get('r3d.how.' + HOW.k, false);
  return `<details class="how" data-how="${HOW.k}"${open ? ' open' : ''}><summary>كيف تلعب؟</summary><ol>${HOW.s.map(t => `<li><span>${t}</span></li>`).join('')}</ol></details>`;
}
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.how) LS.set('r3d.how.' + d.dataset.how, !d.open); }, true);

/* ---------- الطرد والباند وقفل الدخول (مشترك بين الألعاب) ----------
   أي لاعب يصوّت لطرد لاعب، وينطرد لو صوّت أكثر من نص اللي في الغرفة (٧ يبي لها ٤، و٣ يبي لها ٢).
   المؤسس يطرد على طول، أو يعطي باند فما يقدر يرجع من الرابط، ويقدر يقفل الدخول على الجدد.
   كل لعبة تعرّف onPlayerOut(id) عشان تعدّل جولتها لما أحد يطلع. */
const kickNeed = () => Math.floor(S.players.length / 2) + 1;
const outName = id => (S && S.out && S.out[id] && S.out[id].name) || '؟';
const kickVotes = id => (S.kv && S.kv[id]) || [];
const canMod = p => S.phase !== 'closed' && !!player(ME.id) && p.id !== ME.id && p.id !== S.hostId;
const modAttr = p => canMod(p) ? ` data-mod="${esc(p.id)}" role="button" tabindex="0" aria-label="خيارات ${esc(p.name)}"` : '';
function modTag(p){
  const n = kickVotes(p.id).length;
  return (n ? `<span class="badge kick">طرد <span class="num">${n}/${kickNeed()}</span></span>` : '') + (canMod(p) ? '<span class="more" aria-hidden="true">⋯</span>' : '');
}
function lockChip(){
  if (!S || S.phase === 'closed') return '';
  if (isHost()) return `<button class="chip lockbtn" id="lockRoom" type="button" aria-pressed="${!!S.locked}">${S.locked ? '🔒 الدخول مقفل' : '🔓 الدخول مفتوح'}</button>`;
  return S.locked ? '<span class="chip locked">🔒 الدخول مقفل</span>' : '';
}
function modBind(){
  document.querySelectorAll('[data-mod]').forEach(el => {
    el.onclick = () => modSheet(el.dataset.mod);
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); modSheet(el.dataset.mod); } };
  });
  const lk = $('lockRoom');
  if (lk) lk.onclick = () => { S.locked = !S.locked; toast(S.locked ? 'قفلت الدخول، محد جديد يقدر يدخل' : 'فتحت الدخول'); hostPublish(); };
}
function modSheet(id){
  const p = player(id);
  if (!p) return;
  const old = $('msheet'); if (old) old.remove();
  const n = kickVotes(id).length, need = kickNeed(), mine = kickVotes(id).includes(ME.id);
  const bg = document.createElement('div');
  bg.className = 'msheet-bg'; bg.id = 'msheet';
  bg.innerHTML = `<div class="msheet" role="dialog" aria-modal="true" aria-label="خيارات ${esc(p.name)}"><div class="grab"></div>
    <div class="mwho">${avatar(p)}<span>${esc(p.name)}</span>${n ? `<span class="label">أصوات الطرد <span class="num">${n}/${need}</span></span>` : ''}</div>
    ${isHost() ? `<button class="btn ghost" type="button" data-m="kick">اطرده</button><div class="helper" style="margin-top:-4px">يقدر يرجع من الرابط إذا الدخول مفتوح</div>
      <button class="btn red" type="button" data-m="ban">اطرده وامنعه يرجع</button>`
    : `<button class="btn ${mine ? 'ghost' : 'red'}" type="button" data-m="vote">${mine ? 'اسحب صوتي' : 'صوّت لطرده'}</button>
      <div class="helper" style="margin-top:-4px">ينطرد إذا صوّت <span class="num">${need}</span> من <span class="num">${S.players.length}</span> اللي في الغرفة</div>`}
    <button class="btn ghost" type="button" data-m="x">إلغاء</button></div>`;
  document.body.appendChild(bg);
  const close = () => { bg.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc_);
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const m = b.dataset.m;
    close();
    if (m === 'kick' || m === 'ban') hostRemove(id, m === 'ban', 'host');
    else if (m === 'vote') { act({t:'kv', target:id, on:!mine}); toast(mine ? 'سحبت صوتك' : 'انحسب صوتك'); }
  });
  bg.querySelector('[data-m="x"]').focus();
}

// المؤسس
async function hostKickVote(voter, target, on){
  if (!player(voter) || !player(target) || target === S.hostId || target === voter) return;
  S.kv = S.kv || {};
  const l = new Set(S.kv[target] || []);
  if (on) l.add(voter); else l.delete(voter);
  if (l.size) S.kv[target] = [...l]; else delete S.kv[target];
  if (!(await hostKickCheck())) await hostPublish();
}
async function hostKickCheck(){
  let any = false;
  for (;;) {
    const need = kickNeed();
    const hit = Object.entries(S.kv || {}).find(([id, l]) => player(id) && l.filter(v => player(v)).length >= need);
    if (!hit) break;
    await hostRemove(hit[0], false, 'vote', true);
    any = true;
  }
  if (any) await hostPublish();
  return any;
}
async function hostRemove(id, ban, by, quiet){
  const p = player(id);
  if (!p || id === S.hostId) return;
  S.players = S.players.filter(x => x.id !== id);
  S.out = S.out || {};
  S.out[id] = {name:p.name, ban:!!ban, by};
  HOST.outP = HOST.outP || {};
  HOST.outP[id] = p;
  if (S.kv) { delete S.kv[id]; for (const k of Object.keys(S.kv)) { S.kv[k] = S.kv[k].filter(v => v !== id); if (!S.kv[k].length) delete S.kv[k]; } }
  toast(by === 'vote' ? `${p.name} طلع بالتصويت` : ban ? `${p.name} انطرد وانمنع` : `${p.name} انطرد`);
  if (MQC) MQC.pub(`${BASE}/p/${id}`, new Uint8Array(0), true);
  await onPlayerOut(id);
  if (!quiet && !(await hostKickCheck())) await hostPublish();
}
// يرجع false لو الدخول مرفوض، و'back' لو مطرود ورجع بنفسه (يرجع بنقاطه)
function hostJoinAllowed(pid, again){
  const o = S.out && S.out[pid];
  if (o) { if (o.ban || !again || S.locked) return false; delete S.out[pid]; return 'back'; }
  if (S.locked && !player(pid)) return false;
  return true;
}
function hostBackPlayer(pid, name){
  const p = HOST.outP && HOST.outP[pid];
  if (!p) return null;
  delete HOST.outP[pid];
  return {...p, name, on:true, inRound:false, done:false, ready:false, voted:false};
}

// اللاعب
function kickToasts(prev, next){
  if (!prev || !next.out) return;
  for (const [id, o] of Object.entries(next.out)) if (!(prev.out && prev.out[id]) && id !== CL.pid) toast(o.by === 'vote' ? `${o.name} طلع بالتصويت` : o.ban ? `${o.name} انطرد وانمنع` : `${o.name} انطرد`);
}
// يعرض شاشة الطرد أو القفل لو اللاعب برا الغرفة، ويرجع true
function clientOutGate(){
  const o = S.out && S.out[CL.pid];
  if (o) {
    CL.out = true;
    const back = !o.ban && !S.locked;

function pSheet(id){
  const p = player(id); if (!p) return;
  const opts = [];
  if (isMC()) {
    for (const t of ['A', 'B']) if (p.team !== t) opts.push([`انقله ${TEAM[t].l}`, () => act({t:'move', pid:id, team:t})]);
    opts.push(['خلّه الهوست', () => act({t:'mc', to:id})]);
  }
  if (isHost() && id !== S.hostId) { opts.push(['اطرده', () => hostRemove(id, false, 'host')]); opts.push(['اطرده وامنعه يرجع', () => hostRemove(id, true, 'host')]); }
  else if (canMod(p)) { const mine = kickVotes(id).includes(ME.id); opts.push([mine ? 'اسحب صوت الطرد' : `صوّت لطرده (${kickVotes(id).length}/${kickNeed()})`, () => { act({t:'kv', target:id, on:!mine}); toast(mine ? 'سحبت صوتك' : 'انحسب صوتك'); }]); }

}

    S = {v:1, room, hostId, hostPub: await C.exp(kp.publicKey), hostSeen: Date.now(), phase:'lobby', mc:hostId,
      settings:{time:10, rounds:3}, players:[hostPlayer(hostId, name)], round:0, score:{A:0, B:0},
      board:null, sel:null, picker:'A', allow:[], buzz:null, deadline:0, pausedLeft:null, ansTotal:0, halt:false, win:null, qn:0, missed:false, reveal:null, final:false};
    HOST = {room, K: b64u(K), b:0, priv: await C.exp(kp.privateKey), H:{}, pubs:{}, seen:{}};
    await hostConnect(true);
  };
  $('create').onclick = go;
  $('hname').onkeydown = e => { if (e.key === 'Enter') go(); };
}
const hostPlayer = (id, name) => ({id, name, on:true, team:null});

async function hostConnect(fresh){
  skeleton();
  KEY = await C.aes(unb64u(HOST.K));
  HOST.privKey = await C.impPriv(HOST.priv);
  HOST.keys = {};
  ME = {id:S.hostId, name:nameOf(S.hostId)};
  let idx = HOST.b || 0;
  const tryBroker = i => new Promise(res => {
    let done = false;
    const m = new MQ(BROKERS[i], hostOnMsg, s => { setNet(s); if (s === 'up' && !done) { done = true; res(m); } });
    setTimeout(() => { if (!done) { done = true; m.close(); res(null); } }, fresh ? 7000 : 15000);
  });
  let m = await tryBroker(idx);
  if (!m && fresh) for (let i = 0; i < BROKERS.length && !m; i++) if (i !== idx) { m = await tryBroker(i); if (m) idx = i; }
  if (!m) {
    $('app').innerHTML = `<div class="hero"><h2>ما قدرت أتصل</h2><p>تأكد من النت وجرّب مرة ثانية.</p></div>`;
    $('footIn').innerHTML = `<button class="btn" id="retry" type="button">جرّب مرة ثانية</button>`; $('foot').hidden = false;
    $('retry').onclick = () => location.reload();
    return;
  }
  m.onState = s => setNet(s);
  MQC = m; HOST.b = idx;
  BASE = `r3d-hive/v1/${HOST.room}`;
  HOST.link = `${joinBase('hive/')}#${HOST.room}.${HOST.K}.${idx}`;
  MQC.sub(BASE + '/i');
  for (const p of S.players) if (HOST.pubs[p.id]) HOST.keys[p.id] = await C.shared(HOST.privKey, HOST.pubs[p.id]);
  await hostPublish();
  await hostSendPrivates();
  setInterval(hostTick, 500);
  render();
}

function hostSave(){ const {privKey, keys, ...rest} = HOST; LS.set(HKEY, {...rest, S}); }
let prevPhase = null, prevOwn = null;
async function hostPublish(){
  S.hostSeen = Date.now();
  hostSave();
  if (MQC) MQC.pub(BASE + '/s', await C.enc(KEY, S), true);
  cues(prevPhase, prevOwn); prevPhase = S.phase; prevOwn = S.board && S.board.own.join();
  render();
}
// السؤال يروح للهوست بس
function privFor(id){ return id === S.mc && HOST.H.cur ? {qn:S.qn, q:HOST.H.cur} : {qn:S.qn}; }
async function hostSendPrivates(){
  for (const p of S.players) {
    if (p.id === S.hostId || !HOST.keys[p.id]) continue;
    MQC.pub(`${BASE}/p/${p.id}`, await C.enc(HOST.keys[p.id], privFor(p.id)), true);
  }
  PRIV = privFor(S.hostId);
}
let lastBeat = 0;
function hostTick(){
  const now = Date.now();
  let changed = false;
  for (const p of S.players) {
    if (p.id === S.hostId) continue;
    const on = now - (HOST.seen[p.id] || 0) < 25000;
    if (p.on !== on) { p.on = on; changed = true; if (!on) toast(`${p.name} طلع`); }
  }
  // خلص وقت الجواب = غلط
  if (S.phase === 'answer' && S.pausedLeft == null && !S.halt && now >= S.deadline) { toast('خلص الوقت'); return judge(false); }
  if (changed || now - lastBeat > 15000) { lastBeat = now; hostPublish(); }
}

async function hostOnMsg(topic, bytes){
  if (topic !== BASE + '/i') return;
  const m = await C.dec(KEY, bytes);
  if (!m) return;
  if (m.join) {
    const {pid, name, pub} = m.join;
    if (!/^p[a-z0-9]{7}$/.test(pid || '') || !pub || typeof name !== 'string') return;
    const nm = name.trim().slice(0, 16) || 'لاعب';
    if (HOST.pubs[pid] && JSON.stringify(HOST.pubs[pid]) !== JSON.stringify(pub)) return;
    const allowed = hostJoinAllowed(pid, m.join.again);
    if (!allowed) return;
    HOST.seen[pid] = Date.now();
    if (!HOST.keys[pid]) { HOST.pubs[pid] = pub; HOST.keys[pid] = await C.shared(HOST.privKey, pub); }
    let p = player(pid);
    if (!p) { S.players.push(allowed === 'back' && hostBackPlayer(pid, nm) || {...hostPlayer(pid, nm), on:true}); toast(allowed === 'back' ? `${nm} رجع للغرفة` : `${nm} دخل الغرفة`); }
    else { if (!p.on) toast(`${nm} رجع`); p.on = true; p.name = nm; }
    await hostPublish();
    MQC.pub(`${BASE}/p/${pid}`, await C.enc(HOST.keys[pid], privFor(pid)), true);
    return;
  }
  if (m.p && m.c && HOST.keys[m.p]) {
    const a = await C.dec(HOST.keys[m.p], unb64u(m.c));
    if (!a) return;
    HOST.seen[m.p] = Date.now();
    const p = player(m.p);
    if (p && !p.on) { p.on = true; await hostPublish(); }
    if (a.t !== 'ping') await hostAct(m.p, a);
  }
}

async function act(a){ return isHost() ? hostAct(S.hostId, a) : clientAct(a); }

function newBoard(){
  const letters = shuffle(LETTERS).slice(0, N * N);
  return {letters, own: Array(N * N).fill(null)};
}
function nextQ(){
  const H = HOST.H, l = S.board.letters[S.sel], list = BANK[l] || [];
  H.used = H.used || {};
  const used = new Set(H.used[l] || []);
  let free = list.map((_, i) => i).filter(i => !used.has(i));
  if (!free.length) { H.used[l] = []; free = list.map((_, i) => i); }
  const i = free.length ? pick(free) : -1;
  if (i >= 0) H.used[l] = [...(H.used[l] || []), i];
  H.cur = i >= 0 ? {q:list[i][0], a:list[i][1]} : null;
  S.qn++;
}
async function judge(right){
  if (S.phase !== 'answer') return;
  const H = HOST.H, t = S.buzz.team;
  S.pausedLeft = null;
  if (right) {
    S.board.own[S.sel] = t;
    S.reveal = {a: H.cur ? H.cur.a : '', t};
    S.buzz = null; S.sel = null; S.picker = t;
    const path = winPath(S.board.own, t);
    if (path) {
      S.score[t]++; S.win = {team:t, path}; S.phase = 'won';
      S.final = S.round >= S.settings.rounds || S.score[t] > S.settings.rounds / 2;
    } else S.phase = 'pick';
  } else {
    S.tried = [...(S.tried || []), t];
    S.allow = ['A', 'B'].filter(x => !S.tried.includes(x));
    S.buzz = null;
    if (S.allow.length) S.phase = 'buzz';
    else { S.phase = 'q'; S.missed = true; S.reveal = {a: H.cur ? H.cur.a : '', t:null}; }
  }
  await hostSendPrivates();
  await hostPublish();
}
async function startRound(){
  S.round++;
  S.board = newBoard(); S.sel = null; S.win = null; S.buzz = null; S.allow = []; S.tried = []; S.missed = false; S.reveal = null; S.final = false; S.halt = false;
  S.picker = S.round % 2 ? 'A' : 'B';
  S.phase = 'pick';
  await hostPublish();
}

async function hostAct(pid, a){
  const p = player(pid);
  if (!p) return;
  if (a.t === 'kv') return hostKickVote(pid, a.target, !!a.on);
  const mc = pid === S.mc;
  if (a.t === 'team') {
    if (mc || !['A', 'B'].includes(a.team)) return;
    if (S.phase !== 'lobby' && p.team) return;
    p.team = a.team; return hostPublish();
  }
  if (a.t === 'buzz') {
    if (S.phase !== 'buzz' || S.halt || a.qn !== S.qn || !p.team || !S.allow.includes(p.team) || mc) return;
    S.phase = 'answer'; S.buzz = {pid, team:p.team};
    S.ansTotal = S.settings.time * 1000; S.deadline = Date.now() + S.ansTotal; S.pausedLeft = null;
    return hostPublish();
  }
  if (a.t === 'pick') {
    if (S.phase !== 'pick' || S.halt || !Number.isInteger(a.i) || a.i < 0 || a.i >= N * N || S.board.own[a.i]) return;
    if (!mc && p.team !== S.picker) return;
    S.sel = a.i; S.tried = []; S.allow = []; S.missed = false; S.reveal = null;
    nextQ(); S.phase = 'q';
    await hostSendPrivates(); return hostPublish();
  }
  if (!mc) return;
  // من هنا: الهوست بس
  switch (a.t) {
    case 'set': if (S.phase === 'lobby' && ({time:[5, 10, 15, 20], rounds:[1, 3, 5]})[a.k]?.includes(a.v)) { S.settings[a.k] = a.v; return hostPublish(); } return;
    case 'move': { const q = player(a.pid); if (q && q.id !== S.mc && ['A', 'B'].includes(a.team)) { q.team = a.team; return hostPublish(); } return; }
    case 'mc': {
      const q = player(a.to); if (!q || q.id === S.mc) return;
      S.mc = q.id; q.team = null;
      toast(`${q.name} صار الهوست`);
      await hostSendPrivates(); return hostPublish();
    }
    case 'start': case 'again':
      if (S.phase !== (a.t === 'start' ? 'lobby' : 'final')) return;
      if (!['A', 'B'].every(t => S.players.some(x => x.team === t && x.id !== S.mc))) return;
      S.round = 0; S.score = {A:0, B:0};
      return startRound();
    case 'next': if (S.phase === 'won' && !S.final) return startRound(); return;
    case 'final': if (S.phase === 'won') { S.phase = 'final'; return hostPublish(); } return;
    case 'open': if (S.phase === 'q') { S.allow = ['A', 'B']; S.tried = []; S.missed = false; S.phase = 'buzz'; return hostPublish(); } return;
    case 'close': if (S.phase === 'buzz') { S.phase = 'q'; return hostPublish(); } return;
    case 'newq': if (S.phase === 'q' || S.phase === 'buzz') { nextQ(); S.phase = 'q'; S.missed = false; S.tried = []; S.allow = []; await hostSendPrivates(); return hostPublish(); } return;
    case 'unpick': if (S.phase === 'q') { S.sel = null; S.phase = 'pick'; return hostPublish(); } return;
    case 'right': return judge(true);
    case 'wrong': return judge(false);
    case 'add': if (S.phase === 'answer' && [5, -5].includes(a.s)) {
      if (S.pausedLeft != null) S.pausedLeft = Math.max(1000, S.pausedLeft + a.s * 1000);
      else S.deadline = Math.max(Date.now() + 1000, S.deadline + a.s * 1000);
      S.ansTotal = Math.max(S.ansTotal, timeLeftHost());
      return hostPublish(); } return;
    case 'ptime': if (S.phase === 'answer') {
      if (S.pausedLeft != null) { S.deadline = Date.now() + S.pausedLeft; S.pausedLeft = null; }
      else S.pausedLeft = Math.max(0, S.deadline - Date.now());
      return hostPublish(); } return;
    case 'halt':
      if (S.halt) { S.halt = false; if (S.haltLeft != null && S.phase === 'answer') { S.deadline = Date.now() + S.haltLeft; } S.haltLeft = null; }
      else { S.halt = true; if (S.phase === 'answer' && S.pausedLeft == null) S.haltLeft = Math.max(0, S.deadline - Date.now()); }
      return hostPublish();
  }
}
const timeLeftHost = () => S.pausedLeft != null ? S.pausedLeft : Math.max(0, S.deadline - Date.now());

function hostBind(on){
  on('endRoom', async () => {
    const b = $('endRoom');
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'متأكد؟ اضغط مرة ثانية'; return; }
    S.phase = 'closed'; await hostPublish();
    for (const pl of S.players) MQC.pub(`${BASE}/p/${pl.id}`, new Uint8Array(0), true);
    setTimeout(() => { MQC.pub(BASE + '/s', new Uint8Array(0), true); LS.del(HKEY); setTimeout(() => location.reload(), 400); }, 1500);
  });
}

// لاعب انطرد: لو هو الهوست ترجع الهوست للمؤسس، ولو كان يجاوب يرجع الجرس مفتوح
async function onPlayerOut(id){
  if (S.mc === id) { S.mc = S.hostId; const h = player(S.hostId); if (h) h.team = null; await hostSendPrivates(); }
  if (S.phase === 'answer' && S.buzz && S.buzz.pid === id) { S.buzz = null; S.phase = 'buzz'; S.pausedLeft = null; }
}

// أصوات واهتزاز على تغيّر الحالة (للكل)
function cues(pp, po){
  if (!S || pp == null) return;
  if (S.phase === 'answer' && pp !== 'answer') { fx('buzz'); try { navigator.vibrate && navigator.vibrate([40, 40, 80]); } catch(e){} }
  else if (pp === 'answer' && S.phase !== 'answer') {
    const own = S.board && S.board.own.join();
    fx(own !== po ? 'ok' : 'no');
  }
  if (S.phase === 'won' && pp !== 'won') setTimeout(() => fx('win'), 350);
}

/* ======================================================================
   اللاعب: يدخل من الرابط بدون كود
   ====================================================================== */
let CL = null;
async function clientBoot(){
  const [room, k, b] = location.hash.slice(1).split('.');
  if (!room || !k || !BROKERS[+b]) { $('app').innerHTML = `<div class="hero"><h2>الرابط ناقص</h2><p>اطلب من المؤسس يرسل لك رابط الغرفة كامل.</p></div>`; setNet('down'); return; }
  try { KEY = await C.aes(unb64u(k)); } catch(e){ $('app').innerHTML = `<div class="hero"><h2>الرابط غلط</h2><p>اطلب رابط جديد من المؤسس.</p></div>`; return; }
  BASE = `r3d-hive/v1/${room}`;
  const ck = botKey('r3d.hive.c.' + room);
  CL = LS.get(ck, null);
  if (!CL) { const kp = await C.pair(); CL = {room, pid:'p' + rid(7), name:'', priv: await C.exp(kp.privateKey), pub: await C.exp(kp.publicKey)}; LS.set(ck, CL); }
  CL.key = ck; ME = {id:CL.pid, name:CL.name || ''};
  botInit();
  CL.privKey = await C.impPriv(CL.priv);
  skeleton();
  MQC = new MQ(BROKERS[+b], clientOnMsg, s => { setNet(s); if (s === 'up' && CL.name && !CL.out) sendJoin(); });
  MQC.sub(BASE + '/s'); MQC.sub(`${BASE}/p/${CL.pid}`);
  setTimeout(() => { if (!S) $('app').innerHTML = `<div class="hero"><h2>ما لقيت الغرفة</h2><p>يمكن المؤسس قفلها أو جواله مو متصل. تأكد من الرابط وجرّب بعد شوي.</p></div>`; }, 12000);
  setInterval(() => { if (CL.name && CL.shared && !CL.out) clientAct({t:'ping'}); }, 8000);
}
function clientNameScreen(){
  $('app').innerHTML = `<div class="hero"><h2>انضم لـ«خلية الحروف»</h2><p>اكتب اسمك وادخل، ما تحتاج كود.</p></div>
    <div class="card"><div class="field"><label class="label" for="cname">اسمك في اللعبة</label><input id="cname" maxlength="16" autocomplete="off" placeholder="مثلاً: سلمان"></div></div>`;
  $('footIn').innerHTML = `<button class="btn" id="joinBtn" type="button">ادخل</button>`; $('foot').hidden = false; $('over').innerHTML = '';
  const go = () => {
    const n = $('cname').value.trim();
    if (!n) { $('cname').focus(); toast('اكتب اسمك أول'); return; }
    CL.name = n.slice(0, 16);
    const {privKey, shared, key, ...save} = CL; LS.set(CL.key, save);
    ME = {id:CL.pid, name:CL.name};
    if (S && clientOutGate()) return;
    sendJoin(); skeleton();
  };
  $('joinBtn').onclick = go;
  $('cname').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('cname').focus();
}
async function sendJoin(again){ MQC.pub(BASE + '/i', await C.enc(KEY, {join:{pid:CL.pid, name:CL.name, pub:CL.pub, again:!!again}}), false); }
let pendingPriv = null;
async function clientOnMsg(topic, bytes){
  if (topic === BASE + '/s') {
    if (!bytes.length) { if (S) { S.phase = 'closed'; render(); } return; }
    const st = await C.dec(KEY, bytes);
    if (!st) return;
    OFFSET = Date.now() - st.hostSeen;
    const first = !S, pp = S ? S.phase : null, po = S && S.board ? S.board.own.join() : null;
    if (!CL.shared || !S || JSON.stringify(S.hostPub) !== JSON.stringify(st.hostPub)) CL.shared = await C.shared(CL.privKey, st.hostPub);
    kickToasts(S, st);
    if (S && S.mc !== st.mc && st.mc === CL.pid) toast('صرت الهوست! السؤال بيطلع لك');
    S = st;
    cues(pp, po);
    if (pendingPriv) { const b = pendingPriv; pendingPriv = null; await clientPriv(b); }
    if (S.phase !== 'closed' && clientOutGate()) { $('over').innerHTML = ''; return; }
    if (!CL.name) { if (first || CL.showName) { CL.showName = false; clientNameScreen(); } return; }
    ME = {id:CL.pid, name:CL.name};
    if (!player(CL.pid)) { if (first) sendJoin(); skeleton(); return; }
    render();
    return;
  }
  if (topic === `${BASE}/p/${CL.pid}`) {
    if (!bytes.length) return;
    if (!CL.shared) { pendingPriv = bytes; return; }
    await clientPriv(bytes);
    if (S && CL.name && player(CL.pid)) render();
  }
}
async function clientPriv(bytes){ const o = await C.dec(CL.shared, bytes); if (o) PRIV = o; }
async function clientAct(a){
  if (!CL.shared) return;
  const inner = await C.enc(CL.shared, a);
  MQC.pub(BASE + '/i', await C.enc(KEY, {p:CL.pid, c:b64u(inner)}), false);
}

/* ---------- بوت التجربة: يدخل الفريق الأقل، يختار حرف لما يجي دور فريقه، ويضغط الجرس أحياناً.
   ولو صار هو الهوست: يفتح الجرس، ويحكم صح أو غلط عشوائي، ويكمّل الجولة الجاية ---------- */
function botMove(){
  const me = player(ME.id);
  if (!me || S.halt) return;
  if (S.mc === ME.id) {
    if (S.phase === 'q' && Math.random() < .35) return botOnce('o' + S.qn, () => act({t:'open'}));
    if (S.phase === 'answer' && S.buzz && Math.random() < .3) return botOnce(`j${S.qn}.${S.buzz.pid}`, () => act({t:Math.random() < .6 ? 'right' : 'wrong'}));
    if (S.phase === 'won' && !S.final && Math.random() < .2) botOnce('n' + S.round, () => act({t:'next'}));
    return;
  }
  if (!me.team) {
    const n = t => S.players.filter(p => p.team === t && p.id !== S.mc).length;
    if (S.phase === 'lobby') botOnce('t', () => act({t:'team', team:n('A') <= n('B') ? 'A' : 'B'}));
    return;
  }
  if (S.phase === 'pick' && S.picker === me.team && Math.random() < .25) {
    const free = [...Array(N * N).keys()].filter(i => !S.board.own[i]);
    if (free.length) botOnce(`p${S.round}.${S.qn}`, () => act({t:'pick', i:pick(free)}));
    return;
  }
  if (S.phase === 'buzz' && S.allow.includes(me.team) && Math.random() < .2) botOnce(`b${S.qn}.${(S.tried || []).join('')}`, () => act({t:'buzz', qn:S.qn}));
}

/* ---------- تشغيل ---------- */
if (MODE === 'host' && window.parent !== window) { const b = $('toLib'); b.hidden = false; b.onclick = () => parent.postMessage('r3d:back', location.origin); }
if (MODE === 'host') hostBoot(); else clientBoot();
</script>
