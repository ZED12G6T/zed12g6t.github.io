<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1530">
<title>قرنبع</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "../lib/three/three.module.min.js" } }</script>
<script type="module" src="main.js"></script>
</head>
<body>
<div class="sky sky-night" aria-hidden="true"></div>
<div class="sky sky-day" aria-hidden="true"><div class="sun"></div></div>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>

<main class="gate" id="gate">
  <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="اطفي صوت الرعد">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <h1 class="logo">قرنبع</h1>
  <form class="lock" id="lock" autocomplete="off">
    <label for="pw" class="sr">كلمة السر</label>
    <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password" spellcheck="false" required>
    <button type="submit" class="enter" aria-label="ادخل">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5 9 12l5.5 5.5"/></svg>
    </button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

<section class="inside" id="inside" hidden>
  <header class="top">
    <h1 class="logo small">قرنبع</h1>
    <button class="relock" id="relock" type="button">اقفل</button>
  </header>
  <div class="panel">
    <div class="calendar" id="calendar" aria-live="polite"></div>
  </div>
  <p class="credit">المجسمات من <a href="https://kaylousberg.com/game-assets/medieval-hexagon" target="_blank" rel="noopener">KayKit</a> (CC0)، والبحر والقمر من أمثلة <a href="https://threejs.org/examples/" target="_blank" rel="noopener">three.js</a></p>
</section>
</body>
</html>
